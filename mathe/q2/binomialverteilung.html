<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Binomialverteilung – Histogramme</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #f7f6f2;
    --surface:   #ffffff;
    --border:    #d9d6cc;
    --text:      #1a1a18;
    --muted:     #6b6960;
    --accent:    #2d5a3d;
    --bar:       #3b6fb6;
    --hi:        #e07b1a;
    --grid:      #e6e3da;
  }

  html, body { height: 100%; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  header {
    padding: 10px 16px 0;
    display: flex;
    align-items: center;
    gap: 12px 16px;
    flex-wrap: wrap;
  }

  header strong { font-size: 15px; font-weight: 600; }

  .tabs {
    display: inline-flex;
    flex-wrap: wrap;
    border: 2px solid var(--border);
    border-radius: 22px;
    overflow: hidden;
    background: var(--surface);
  }

  .tabs .btn { border: none; border-radius: 0; padding: 0 16px; }

  /* Eingebettet in die Erarbeitungsseite (?eingebettet): ohne Titel und Reiter */
  body.embedded header { display: none; }
  body.embedded #stage { margin: 0; border-radius: 0; border-left: 0; border-right: 0; border-top: 0; }

  #stage {
    flex: 1;
    position: relative;
    min-height: 0;
    margin: 8px 16px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  #chart {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  #grid4 {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
  }

  #grid4 .cell { position: relative; min-width: 0; min-height: 0; }
  #grid4 svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .pick { position: absolute; top: 6px; right: 10px; display: flex; gap: 4px; z-index: 1; }
  .pick .btn { min-width: 44px; min-height: 44px; padding: 0 8px; font-size: 16px; border-radius: 12px; }
  .mark { position: absolute; top: 2px; left: 38px; font-size: 28px; font-weight: 700; z-index: 1; }
  .ok  { color: #2e7d32; }
  .bad { color: #c62828; }
  .status { font-size: 19px; font-weight: 600; text-align: center; }
  .whybox {
    max-width: 760px;
    padding: 10px 14px;
    background: #e8f0eb;
    border-radius: 8px;
    font-size: 17px;
    line-height: 1.4;
  }
  .whybox i { font-family: "Times New Roman", Times, serif; font-size: 1.1em; }

  .controls {
    padding: 8px 16px calc(14px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 860px;
  }

  .row.buttons { justify-content: center; flex-wrap: wrap; gap: 8px; }

  [hidden] { display: none !important; }

  .param {
    flex: none;
    width: 28px;
    font-size: 24px;
    font-style: italic;
    font-family: "Times New Roman", Times, serif;
    text-align: center;
  }

  .step {
    flex: none;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--surface);
    font-size: 26px;
    line-height: 1;
    color: var(--text);
    cursor: pointer;
  }

  .step:active { background: #eee; }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    min-width: 0;
    height: 48px;
    background: transparent;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 5px; background: var(--border); }
  input[type=range]::-moz-range-track { height: 10px; border-radius: 5px; background: var(--border); }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 34px;
    height: 34px;
    margin-top: -12px;
    border-radius: 50%;
    background: var(--surface);
    border: 3px solid var(--text);
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
  }

  input[type=range]::-moz-range-thumb {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--surface); border: 3px solid var(--text);
  }

  .readout {
    flex: none;
    min-width: 72px;
    text-align: right;
    font-size: 24px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .value {
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-variant-numeric: tabular-nums;
  }

  .value .hint { color: var(--muted); font-size: 17px; }
  .value i { font-family: "Times New Roman", Times, serif; font-size: 24px; }

  .btn {
    min-height: 44px;
    padding: 0 20px;
    border-radius: 22px;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 16px;
    cursor: pointer;
  }

  .btn:disabled { cursor: default; opacity: .45; }

  .btn[aria-pressed=true], .btn[aria-selected=true] {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .btn.letter { min-width: 56px; padding: 0 12px; font-size: 20px; font-weight: 600; }

  /* SVG */
  .axis      { stroke: var(--text); stroke-width: 1.5; }
  .gridline  { stroke: var(--grid); stroke-width: 1; }
  .ticklabel { fill: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .axislabel { fill: var(--text); font-size: 17px; font-family: "Times New Roman", Times, serif; font-style: italic; }
  .axislabel tspan.up { font-style: normal; }
  .title     { fill: var(--text); font-size: 17px; font-family: "Times New Roman", Times, serif; }
  .subtitle  { fill: var(--muted); font-size: 15px; font-family: "Times New Roman", Times, serif; }
  .letterlabel { fill: var(--text); font-size: 26px; font-weight: 700; }
  .bar       { fill: var(--bar); }
  .bar.max   { fill: var(--hi); }
  .bar.sel   { fill: var(--hi); }
  .bar.dim   { fill: #9fb6d8; }
  .bar.outlined { stroke: var(--text); stroke-width: 2; }
  .ghost     { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 3; }
  .guess     { fill: none; stroke: var(--hi); stroke-width: 3; }
  .cut       { fill: none; stroke: #fff; stroke-width: 3; }
  .cutarrow  { fill: #fff; }

  /* Lehrermodus */
  #teacher {
    position: fixed;
    top: 8px;
    right: 8px;
    width: 290px;
    max-height: calc(100% - 16px);
    overflow: auto;
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    box-shadow: 0 4px 16px rgba(0,0,0,.15);
    z-index: 10;
  }

  #teacher summary { cursor: pointer; font-weight: 600; color: var(--accent); }
  #teacher h3 { font-size: 13px; margin-top: 10px; }
  #teacher label { display: grid; grid-template-columns: 1fr 80px; gap: 2px 8px; margin-top: 6px; align-items: center; }
  #teacher label.check { grid-template-columns: 20px 1fr; }
  #teacher input { width: 100%; font: inherit; padding: 4px; }
  #teacher .btn { margin-top: 10px; min-height: 34px; font-size: 13px; padding: 0 12px; }
  #teacher .note { color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>

<header>
  <strong>Binomialverteilung</strong>
  <div class="tabs" role="tablist" aria-label="Teil auswählen">
    <button class="btn" role="tab" data-part="1">1 Lesen</button>
    <button class="btn" role="tab" data-part="2">2 n und p</button>
    <button class="btn" role="tab" data-part="3">3 Zuordnen</button>
    <button class="btn" role="tab" data-part="4">4 Prüfen</button>
    <button class="btn" role="tab" data-part="5">5 Schätzen</button>
  </div>
</header>

<div id="stage">
  <svg id="chart" xmlns="http://www.w3.org/2000/svg" aria-label="Histogramm"></svg>
  <div id="grid4" hidden>
    <div class="cell"><div class="pick" data-i="0"></div><span class="mark" id="mark3_0"></span><svg xmlns="http://www.w3.org/2000/svg" aria-label="Histogramm A"></svg></div>
    <div class="cell"><div class="pick" data-i="1"></div><span class="mark" id="mark3_1"></span><svg xmlns="http://www.w3.org/2000/svg" aria-label="Histogramm B"></svg></div>
    <div class="cell"><div class="pick" data-i="2"></div><span class="mark" id="mark3_2"></span><svg xmlns="http://www.w3.org/2000/svg" aria-label="Histogramm C"></svg></div>
    <div class="cell"><div class="pick" data-i="3"></div><span class="mark" id="mark3_3"></span><svg xmlns="http://www.w3.org/2000/svg" aria-label="Histogramm D"></svg></div>
  </div>
</div>

<div class="controls">
  <div class="row buttons" id="rowLetters" hidden></div>
  <div class="row" id="rowN" hidden>
    <span class="param">n</span>
    <button class="step" id="nMinus" aria-label="n verkleinern">−</button>
    <input type="range" id="nSlider" min="10" max="50" step="1" value="10" aria-label="n">
    <button class="step" id="nPlus" aria-label="n vergrößern">+</button>
    <span class="readout" id="nOut">10</span>
  </div>
  <div class="row" id="rowP" hidden>
    <span class="param">p</span>
    <button class="step" id="pMinus" aria-label="p verkleinern">−</button>
    <input type="range" id="pSlider" min="0" max="100" step="1" value="50" aria-label="p">
    <button class="step" id="pPlus" aria-label="p vergrößern">+</button>
    <span class="readout" id="pOut">0,50</span>
  </div>
  <div class="row buttons" id="rowButtons2" hidden>
    <button class="btn" id="btnFixK" aria-pressed="true">k-Achse festhalten</button>
    <button class="btn" id="btnFixY" aria-pressed="true">Hochachse festhalten</button>
    <button class="btn" id="btnGhost">Vergleichsbild merken</button>
    <button class="btn" id="btnGhostClear" disabled>Vergleichsbild löschen</button>
  </div>
  <div class="row buttons" id="rowButtons3" hidden>
    <button class="btn" id="btnCheck3">Prüfen</button>
  </div>
  <div class="row buttons" id="rowAnswer4" hidden>
    <button class="btn" id="ans4yes" aria-pressed="false">kann passen</button>
    <button class="btn" id="ans4no" aria-pressed="false">kann nicht passen</button>
    <button class="btn" id="btnCheck4" disabled>Prüfen</button>
    <button class="btn" id="btnWhy4" aria-pressed="false" hidden>Begründung vergleichen</button>
  </div>
  <div class="row buttons" id="rowButtons5" hidden>
    <button class="btn" id="btnCompare" aria-pressed="false">Vergleichen</button>
    <button class="btn" id="btnNew">Neues Histogramm</button>
    <button class="btn" id="btnSolve" hidden>Auflösen</button>
  </div>
  <div class="row value" id="valueRow"></div>
  <div class="row buttons status" id="statusRow" hidden></div>
  <div class="whybox" id="why4" hidden></div>
</div>

<script>
'use strict';

/* ─────────────────────────────────────────────
   Einstellungen (im Lehrermodus über ?lehrer veränderbar)
   ───────────────────────────────────────────── */
const CFG = {
  part1N: 10,      // Teil 1: Multiple-Choice-Test, 10 Fragen,
  part1P: 0.25,    //         4 Antworten, eine richtig
  part2NMin: 10,   // Teil 2: kleinstes n am Regler
  part2NMax: 50,   // Teil 2: größtes n am Regler, zugleich Ende der festen k-Achse
  fixedYMax: 0.3,  // Teil 2 und 5: feste Hochachse (höhere Balken werden gekappt)
  showSolutions: false,  // Lehrermodus: Parameter in Teil 1, 3 und 5 anzeigen
};

const HASHES = { 1: '#lesen', 2: '#erkunden', 3: '#zuordnen', 4: '#pruefen', 5: '#schaetzen' };
const SVGNS = 'http://www.w3.org/2000/svg';

/* ── Mathematik ── */
function binom(n, p) {
  const v = new Array(n + 1);
  let c = 1;                                   // Binomialkoeffizient (n über k)
  for (let k = 0; k <= n; k++) {
    if (k > 0) c = c * (n - k + 1) / k;
    v[k] = c * Math.pow(p, k) * Math.pow(1 - p, n - k);
  }
  return v;
}

function fmt(x, d) { return x.toFixed(d).replace('.', ','); }

function fmtP(p) {
  const s = String(Math.round(p * 10000) / 10000);
  const dec = s.includes('.') ? s.split('.')[1].length : 0;
  return fmt(p, Math.max(2, dec));
}

function niceStep(max, target) {
  const raw = max / target;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * mag >= raw) return m * mag;
  return 10 * mag;
}

function niceMax(dataMax) {
  const step = niceStep(dataMax, 5);
  let yMax = Math.max(step, Math.ceil(dataMax / step - 1e-9) * step);
  if (yMax < dataMax) yMax += step;
  return yMax;
}

/* ── Teil 3: vier Histogramme mit gleichen Achsen (Verteilungen stehen auf der Erarbeitungsseite) ── */
const PART3 = [
  { n: 20, p: 0.8 },   // A
  { n: 40, p: 0.5 },   // B
  { n: 20, p: 0.2 },   // C
  { n: 20, p: 0.5 },   // D
];
const PART3_KMAX = 40, PART3_YMAX = 0.25;
// Lösung: Nummer der Verteilung auf der Erarbeitungsseite
// (1) n = 20, p = 0,5   (2) n = 20, p = 0,2   (3) n = 40, p = 0,5   (4) n = 20, p = 0,8
const PART3_KEY = [4, 3, 2, 1];

/* ── Teil 4: Diagramme mit angegebener Verteilung; nicht alle passen dazu ── */
function mix(a, b, w) { return a.map((x, k) => w * x + (1 - w) * b[k]); }
const PART4 = [
  { n: 10, p: 0.6, values: binom(10, 0.6).map(x => 1.25 * x) },       // A: Summe der Höhen 1,25
  { n: 10, p: 0.3, values: binom(10, 0.3) },                           // B: passt
  { n: 10, p: 0.5, values: binom(10, 0.38) },                          // C: nicht symmetrisch
  { n: 15, p: 0.8, values: binom(15, 0.8) },                           // D: passt
  { n: 8,  p: 0.4, values: mix(binom(8, 0.15), binom(8, 0.75), 0.5) }, // E: zwei Gipfel
  { n: 10, p: 0.2, values: binom(10, 0.7) },                           // F: Gipfel auf der falschen Seite
];
const LETTERS = 'ABCDEF';
// Lösung zu Teil 4: kann passen? und Begründung (erscheint nach richtiger Entscheidung)
const PART4_KEY = [
  { ok: false, why: 'Die Balkenhöhen ergeben zusammen 1,25 und nicht 1. Die Gesamtfläche eines Histogramms einer Wahrscheinlichkeitsverteilung ist immer 1.' },
  { ok: true,  why: 'Alles passt: Die Höhen ergeben zusammen 1, es gibt nur einen Gipfel, und er liegt bei <i>k</i> = 3, also links, wie es zu <i>p</i> = 0,3 passt.' },
  { ok: false, why: 'Für <i>p</i> = 0,5 müsste das Histogramm symmetrisch zu <i>k</i> = 5 sein. Hier liegt der Gipfel bei <i>k</i> = 4, und links ist es höher als rechts.' },
  { ok: true,  why: 'Alles passt: Die Höhen ergeben zusammen 1, es gibt nur einen Gipfel, und er liegt bei <i>k</i> = 12, also rechts, wie es zu <i>p</i> = 0,8 passt.' },
  { ok: false, why: 'Das Diagramm hat zwei getrennte Gipfel. Ein Histogramm einer Binomialverteilung steigt bis zu einem Gipfel an und fällt danach ab.' },
  { ok: false, why: 'Bei <i>p</i> = 0,2 sind Erfolge selten, der Gipfel müsste links bei kleinem <i>k</i> liegen. Hier liegt er bei <i>k</i> = 7.' },
];

/* ── Zustand ── */
const state = {
  part: 1,
  sel: { 1: null, 2: null, 4: null, 5: null },
  // Teil 2
  n2: 10, p2: 0.5, fixK: true, fixY: true, ghost: null,
  // Teil 4
  d4: 0, ans4: Array(6).fill(null), res4: Array(6).fill(null), why4: false,
  // Teil 3
  ans3: Array(4).fill(null), res3: Array(4).fill(null), checked3: false,
  // Teil 5
  n5: 25, p5: 0.5, target: null, compare: false, solved5: false, timer5: null,
};

function newTarget() {
  let n, p, guard = 0;
  do {
    n = 10 + Math.floor(Math.random() * 31);              // 10 … 40
    p = (2 + Math.floor(Math.random() * 17)) / 20;         // 0,10 … 0,90 in 0,05-Schritten
    guard++;
  } while ((Math.max(...binom(n, p)) > CFG.fixedYMax ||
            (state.target && state.target.n === n && state.target.p === p)) && guard < 200);
  state.target = { n, p };
  state.compare = false;
  state.sel[5] = null;
  state.solved5 = false;
  clearTimeout(state.timer5); state.timer5 = null;
  const solve = document.getElementById('btnSolve');
  if (solve) solve.hidden = true;
}

/* ── Zeichnen ── */
function el(svg, name, attrs) {
  const e = document.createElementNS(SVGNS, name);
  for (const a in attrs) e.setAttribute(a, attrs[a]);
  svg.appendChild(e);
  return e;
}

/*
  opts: values, kMax, yMax (null = anpassen), highlightMax, sel, dim, outlineSel,
        overlays [{values, cls}], title, subtitle, letter, small
*/
function drawHist(svg, opts) {
  const W = svg.clientWidth, H = svg.clientHeight;
  if (!W || !H) return null;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  const values = opts.values;
  const overlays = opts.overlays || [];
  const n = values.length - 1;
  const kMax = Math.max(opts.kMax ?? n, n, ...overlays.map(o => o.values.length - 1));
  const dataMax = Math.max(...values, ...overlays.flatMap(o => o.values));
  const yMax = opts.yMax ?? niceMax(dataMax);
  const yStep = niceStep(yMax, opts.small || H < 360 ? 4 : 6);

  const m = opts.small ? { l: 48, r: 16, t: 58, b: 42 } : { l: 64, r: 18, t: 40, b: 50 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const slot = pw / (kMax + 1);
  const barW = Math.max(1, slot * (kMax > 30 ? 0.86 : 0.8));
  const X = k => m.l + slot * (k + 0.5);
  const Y = v => m.t + ph * (1 - Math.min(v, yMax) / yMax);

  // Gitter und Beschriftung Hochachse
  const yDec = (String(+yStep.toPrecision(6)).split('.')[1] || '').length;
  for (let i = 0; i * yStep <= yMax + 1e-9; i++) {
    const v = i * yStep, y = Y(v);
    if (i > 0) el(svg, 'line', { x1: m.l, x2: m.l + pw, y1: y, y2: y, class: 'gridline' });
    const t = el(svg, 'text', { x: m.l - 8, y: y + 4, 'text-anchor': 'end', class: 'ticklabel' });
    t.textContent = fmt(v, i === 0 ? 0 : yDec);
  }

  // Balken
  const maxV = Math.max(...values);
  for (let k = 0; k <= n; k++) {
    const v = values[k];
    const y = Y(v), h = m.t + ph - y;
    let cls = 'bar';
    if (opts.highlightMax && maxV - v < 1e-12) cls += ' max';
    if (opts.dim && opts.sel !== null && opts.sel !== undefined) cls += opts.sel === k ? ' sel' : ' dim';
    if (opts.outlineSel && opts.sel === k) cls += ' outlined';
    el(svg, 'rect', { x: X(k) - barW / 2, y, width: barW, height: Math.max(0, h), class: cls });
    if (v > yMax) {
      // Balken ist höher als die Hochachse: oben mit Bruchkante und Pfeil kennzeichnen
      const x0 = X(k) - barW / 2, z = Math.min(6, barW / 4), a = Math.min(7, barW / 3);
      el(svg, 'path', { d: `M${x0 - 1} ${y + 22} l${barW / 4 + 1} ${-z} l${barW / 4} ${z} l${barW / 4} ${-z} l${barW / 4 + 1} ${z}`, class: 'cut' });
      el(svg, 'path', { d: `M${X(k) - a} ${y + 14} L${X(k)} ${y + 5} L${X(k) + a} ${y + 14} Z`, class: 'cutarrow' });
    }
  }

  // Umrisse (Vergleichsbild, Schätzung)
  for (const o of overlays) {
    o.values.forEach((v, k) => {
      if (v < yMax * 1e-4) return;
      const y = Y(v);
      el(svg, 'rect', { x: X(k) - barW / 2, y, width: barW, height: m.t + ph - y, class: o.cls });
    });
  }

  // Achsen
  el(svg, 'line', { x1: m.l, x2: m.l + pw, y1: m.t + ph, y2: m.t + ph, class: 'axis' });
  el(svg, 'line', { x1: m.l, x2: m.l, y1: m.t + ph, y2: m.t - 10, class: 'axis' });

  // Beschriftung Rechtsachse
  let kStep = 1;
  for (const s of [1, 2, 5, 10, 20]) { kStep = s; if (slot * s >= 26) break; }
  for (let k = 0; k <= kMax; k += kStep) {
    const t = el(svg, 'text', { x: X(k), y: m.t + ph + 20, 'text-anchor': 'middle', class: 'ticklabel' });
    t.textContent = k;
  }

  // Achsentitel
  const tk = el(svg, 'text', { x: m.l + pw, y: m.t + ph + (opts.small ? 38 : 42), 'text-anchor': 'end', class: 'axislabel' });
  tk.textContent = 'k';
  if (opts.letter) {
    const tl = el(svg, 'text', { x: 10, y: 28, class: 'letterlabel' });
    tl.textContent = opts.letter;
  } else {
    const ty = el(svg, 'text', { x: 8, y: 22, class: 'axislabel' });
    ty.innerHTML = 'P<tspan class="up">(</tspan>X<tspan class="up"> = </tspan>k<tspan class="up">)</tspan>';
  }

  if (opts.title) {
    const tt = el(svg, 'text', { x: m.l + pw, y: 22, 'text-anchor': 'end', class: 'title' });
    tt.innerHTML = opts.title;
  }
  if (opts.subtitle) {
    const tg = el(svg, 'text', { x: m.l + pw, y: 40, 'text-anchor': 'end', class: 'subtitle' });
    tg.innerHTML = opts.subtitle;
  }

  return { m, slot, n };
}

const np = (n, p) => `<tspan font-style="italic">n</tspan> = ${n},  <tspan font-style="italic">p</tspan> = ${fmtP(p)}`;

const svg = document.getElementById('chart');
const grid4 = document.getElementById('grid4');
let geom = null;
let shownValues = null;   // Werte des großen Diagramms (für Anzeige und „Werte kopieren“)

function draw() {
  const part = state.part;
  svg.style.display = part === 3 ? 'none' : '';
  grid4.hidden = part !== 3;

  if (part === 3) {
    [...grid4.querySelectorAll('svg')].forEach((s, i) => {
      const d = PART3[i];
      drawHist(s, {
        values: binom(d.n, d.p), kMax: PART3_KMAX, yMax: PART3_YMAX, small: true,
        letter: LETTERS[i], title: CFG.showSolutions ? np(d.n, d.p) : null,
      });
    });
    geom = null; shownValues = null;
    drawStatus();
    return;
  }

  let opts;
  if (part === 1) {
    shownValues = binom(CFG.part1N, CFG.part1P);
    opts = { values: shownValues, sel: state.sel[1], dim: true,
             title: CFG.showSolutions ? np(CFG.part1N, CFG.part1P) : null };
  } else if (part === 2) {
    shownValues = binom(state.n2, state.p2);
    const g = state.ghost;
    opts = {
      values: shownValues, highlightMax: true, sel: state.sel[2], outlineSel: true,
      kMax: state.fixK ? CFG.part2NMax : null, yMax: state.fixY ? CFG.fixedYMax : null,
      overlays: g ? [{ values: g.values, cls: 'ghost' }] : [],
      title: np(state.n2, state.p2),
      subtitle: g ? `Vergleich (gestrichelt): ${np(g.n, g.p)}` : null,
    };
  } else if (part === 4) {
    const d = PART4[state.d4];
    shownValues = d.values;
    opts = { values: shownValues, sel: state.sel[4], outlineSel: true, yMax: 0.35,
             title: `${LETTERS[state.d4]}:  ${np(d.n, d.p)}` };
  } else {
    const t = state.target;
    shownValues = binom(t.n, t.p);
    opts = {
      values: shownValues, sel: state.sel[5], outlineSel: true,
      kMax: CFG.part2NMax, yMax: CFG.fixedYMax,
      overlays: state.compare ? [{ values: binom(state.n5, state.p5), cls: 'guess' }] : [],
      title: CFG.showSolutions || state.solved5 ? `gesucht: ${np(t.n, t.p)}` : null,
      subtitle: state.compare ? `Schätzung (Umriss): ${np(state.n5, state.p5)}` : null,
    };
  }
  geom = drawHist(svg, opts);
  updateValue();
  drawStatus();
}

/* ── Lösungskontrollen (Teil 3, 4, 5) ── */
function drawStatus() {
  const row = $('statusRow');
  let html = '';
  if (state.part === 3) {
    document.querySelectorAll('.pick').forEach(pk => {
      const i = +pk.dataset.i;
      [...pk.children].forEach((b, j) => b.setAttribute('aria-pressed', state.ans3[i] === j + 1));
      const m = $('mark3_' + i);
      m.textContent = state.res3[i] === null ? '' : state.res3[i] ? '✓' : '✗';
      m.className = 'mark ' + (state.res3[i] ? 'ok' : 'bad');
    });
    if (state.checked3) {
      const right = state.res3.filter(x => x).length;
      html = right === 4 ? '<span class="ok">✓ Alle vier richtig zugeordnet.</span>'
                         : `${right} von 4 richtig. Überprüfe die mit ✗ markierten Histogramme.`;
    }
  } else if (state.part === 4) {
    const i = state.d4, a = state.ans4[i], r = state.res4[i];
    $('ans4yes').setAttribute('aria-pressed', a === true);
    $('ans4no').setAttribute('aria-pressed', a === false);
    $('btnCheck4').disabled = a === null;
    $('btnWhy4').hidden = r !== true;
    $('btnWhy4').setAttribute('aria-pressed', state.why4);
    $('why4').hidden = !(r === true && state.why4);
    $('why4').innerHTML = PART4_KEY[i].why;
    [...$('rowLetters').children].forEach((b, j) => {
      b.textContent = LETTERS[j] + (state.res4[j] === null ? '' : state.res4[j] ? ' ✓' : ' ✗');
    });
    if (r === true) html = '<span class="ok">✓ Richtig entschieden.</span>';
    else if (r === false) html = '<span class="bad">✗ Noch nicht richtig.</span> Geh die Checkliste aus dem Tipp noch einmal durch.';
  } else if (state.part === 5) {
    const t = state.target;
    if (state.solved5) html = `Gesucht war <i>n</i>&nbsp;=&nbsp;${t.n}, <i>p</i>&nbsp;=&nbsp;${fmt(t.p, 2)}.`;
    else if (state.compare && state.n5 === t.n && Math.round(state.p5 * 100) === Math.round(t.p * 100))
      html = '<span class="ok">✓ Genau getroffen!</span>';
  }
  row.innerHTML = html ? `<span>${html}</span>` : '';
  row.hidden = !html;
  if (state.part !== 4) $('why4').hidden = true;
}

function updateValue() {
  const row = document.getElementById('valueRow');
  const sel = state.sel[state.part];
  if (sel === null || sel === undefined || !shownValues || sel >= shownValues.length) {
    row.innerHTML = '<span class="hint">Tippe auf einen Balken.</span>';
  } else if (state.part === 4) {
    row.innerHTML = `<span><i>k</i>&nbsp;=&nbsp;${sel}:&emsp;Höhe des Balkens&nbsp;${fmt(shownValues[sel], 4)}</span>`;
  } else {
    row.innerHTML = `<span><i>k</i>&nbsp;=&nbsp;${sel}:&emsp;<i>P</i>(<i>X</i>&nbsp;=&nbsp;${sel})&nbsp;=&nbsp;${fmt(shownValues[sel], 4)}</span>`;
  }
}

/* ── Antippen: nächster Balken zur Tippstelle ── */
svg.addEventListener('pointerdown', e => {
  if (!geom) return;
  const r = svg.getBoundingClientRect();
  const k = Math.floor((e.clientX - r.left - geom.m.l) / geom.slot);
  if (k < 0 || k > geom.n) return;
  const p = state.part;
  state.sel[p] = state.sel[p] === k ? null : k;
  draw();
});

/* ── Bedienung ── */
const $ = id => document.getElementById(id);
const tabs = [...document.querySelectorAll('[role=tab]')];

// Regler gelten in Teil 2 für das Histogramm, in Teil 5 für die Schätzung
function getNP() { return state.part === 5 ? [state.n5, state.p5] : [state.n2, state.p2]; }

function setNP(n, p) {
  n = Math.max(CFG.part2NMin, Math.min(CFG.part2NMax, Math.round(n)));
  p = Math.max(0, Math.min(1, Math.round(p * 100) / 100));
  if (state.part === 5) { state.n5 = n; state.p5 = p; }
  else {
    state.n2 = n; state.p2 = p;
    if (state.sel[2] !== null && state.sel[2] > n) state.sel[2] = null;
  }
  $('nSlider').value = n; $('nOut').textContent = n;
  $('pSlider').value = Math.round(p * 100); $('pOut').textContent = fmt(p, 2);
  draw();
}

function partFromHash() {
  return Number(Object.keys(HASHES).find(k => HASHES[k] === location.hash)) || 1;
}

function showPart(k) {
  state.part = k;
  tabs.forEach(t => t.setAttribute('aria-selected', Number(t.dataset.part) === k));
  $('rowN').hidden = $('rowP').hidden = !(k === 2 || k === 5);
  $('rowButtons2').hidden = k !== 2;
  $('rowButtons5').hidden = k !== 5;
  $('rowLetters').hidden = k !== 4;
  $('valueRow').hidden = k === 3;
  $('rowButtons3').hidden = k !== 3;
  $('rowAnswer4').hidden = k !== 4;
  if (location.hash !== HASHES[k]) history.replaceState(null, '', HASHES[k]);
  if (k === 2 || k === 5) { const [n, p] = getNP(); setNP(n, p); } else draw();
}

tabs.forEach(t => t.addEventListener('click', () => showPart(Number(t.dataset.part))));
window.addEventListener('hashchange', () => showPart(partFromHash()));

$('nSlider').addEventListener('input', () => setNP(+$('nSlider').value, getNP()[1]));
$('pSlider').addEventListener('input', () => setNP(getNP()[0], +$('pSlider').value / 100));
$('nMinus').addEventListener('click', () => { const [n, p] = getNP(); setNP(n - 1, p); });
$('nPlus').addEventListener('click',  () => { const [n, p] = getNP(); setNP(n + 1, p); });
$('pMinus').addEventListener('click', () => { const [n, p] = getNP(); setNP(n, p - 0.01); });
$('pPlus').addEventListener('click',  () => { const [n, p] = getNP(); setNP(n, p + 0.01); });

$('btnFixK').addEventListener('click', () => {
  state.fixK = !state.fixK; $('btnFixK').setAttribute('aria-pressed', state.fixK); draw();
});
$('btnFixY').addEventListener('click', () => {
  state.fixY = !state.fixY; $('btnFixY').setAttribute('aria-pressed', state.fixY); draw();
});
$('btnGhost').addEventListener('click', () => {
  state.ghost = { n: state.n2, p: state.p2, values: binom(state.n2, state.p2) };
  $('btnGhostClear').disabled = false; draw();
});
$('btnGhostClear').addEventListener('click', () => {
  state.ghost = null; $('btnGhostClear').disabled = true; draw();
});

$('btnCompare').addEventListener('click', () => {
  state.compare = !state.compare; $('btnCompare').setAttribute('aria-pressed', state.compare);
  // „Auflösen“ erscheint zwei Minuten nach dem ersten Vergleichen
  if (state.compare && !state.timer5 && !state.solved5)
    state.timer5 = setTimeout(() => { $('btnSolve').hidden = false; }, 120000);
  draw();
});
$('btnSolve').addEventListener('click', () => { state.solved5 = true; $('btnSolve').hidden = true; draw(); });

// Teil 3: Auswahl (1)–(4) je Histogramm
document.querySelectorAll('.pick').forEach(pk => {
  const i = +pk.dataset.i;
  for (let j = 1; j <= 4; j++) {
    const b = document.createElement('button');
    b.className = 'btn'; b.textContent = `(${j})`;
    b.setAttribute('aria-label', `Histogramm ${LETTERS[i]}: Verteilung ${j}`);
    b.addEventListener('click', () => {
      state.ans3[i] = state.ans3[i] === j ? null : j;
      state.res3[i] = null; state.checked3 = false; draw();
    });
    pk.appendChild(b);
  }
});
$('btnCheck3').addEventListener('click', () => {
  state.res3 = state.ans3.map((a, i) => a === null ? false : a === PART3_KEY[i]);
  state.checked3 = true; draw();
});

// Teil 4: kann passen / kann nicht passen
function answer4(v) {
  const i = state.d4;
  state.ans4[i] = state.ans4[i] === v ? null : v;
  state.res4[i] = null; state.why4 = false; draw();
}
$('ans4yes').addEventListener('click', () => answer4(true));
$('ans4no').addEventListener('click', () => answer4(false));
$('btnCheck4').addEventListener('click', () => {
  const i = state.d4;
  if (state.ans4[i] === null) return;
  state.res4[i] = state.ans4[i] === PART4_KEY[i].ok; state.why4 = false; draw();
});
$('btnWhy4').addEventListener('click', () => { state.why4 = !state.why4; draw(); });
$('btnNew').addEventListener('click', () => {
  newTarget(); $('btnCompare').setAttribute('aria-pressed', false); draw();
});

// Buchstaben für Teil 4
PART4.forEach((d, i) => {
  const b = document.createElement('button');
  b.className = 'btn letter';
  b.textContent = LETTERS[i];
  b.setAttribute('aria-pressed', i === 0);
  b.addEventListener('click', () => {
    state.d4 = i; state.sel[4] = null; state.why4 = false;
    [...$('rowLetters').children].forEach((c, j) => c.setAttribute('aria-pressed', j === i));
    draw();
  });
  $('rowLetters').appendChild(b);
});

new ResizeObserver(draw).observe($('stage'));

/* ── Lehrermodus ── */
function setupTeacher() {
  const box = document.createElement('details');
  box.id = 'teacher';
  box.innerHTML = `
    <summary>Lehrermodus</summary>
    <h3>Teil 1</h3>
    <label>n <input type="number" id="t1n" min="1" max="100" step="1"></label>
    <label>p <input type="number" id="t1p" min="0" max="1" step="0.001"></label>
    <h3>Teil 2 und 5</h3>
    <label>kleinstes n am Regler <input type="number" id="t2min" min="1" max="50" step="1"></label>
    <label>größtes n (Ende k-Achse) <input type="number" id="t2max" min="10" max="100" step="1"></label>
    <label>Hochachse fest bis <input type="number" id="t2y" min="0.05" max="1" step="0.05"></label>
    <h3>Teil 1, 3 und 5</h3>
    <label class="check"><input type="checkbox" id="tSol"> n und p anzeigen</label>
    <button class="btn" id="tCopy">Werte kopieren</button>
    <div class="note" id="tNote">Kopiert die Tabelle k, Höhe des angezeigten Diagramms (in Teil 3 die Parameter A–D).</div>`;
  document.body.appendChild(box);

  const f = id => box.querySelector('#' + id);
  f('t1n').value = CFG.part1N;
  f('t1p').value = CFG.part1P;
  f('t2min').value = CFG.part2NMin;
  f('t2max').value = CFG.part2NMax;
  f('t2y').value = CFG.fixedYMax;

  f('t1n').addEventListener('change', e => {
    CFG.part1N = Math.max(1, Math.min(100, Math.round(+e.target.value || 1)));
    e.target.value = CFG.part1N; state.sel[1] = null; draw();
  });
  f('t1p').addEventListener('change', e => {
    CFG.part1P = Math.max(0, Math.min(1, +e.target.value || 0));
    e.target.value = CFG.part1P; draw();
  });
  f('t2min').addEventListener('change', e => {
    CFG.part2NMin = Math.max(1, Math.min(CFG.part2NMax, Math.round(+e.target.value || 1)));
    e.target.value = CFG.part2NMin; $('nSlider').min = CFG.part2NMin;
    const [n, p] = getNP(); setNP(n, p);
  });
  f('t2max').addEventListener('change', e => {
    CFG.part2NMax = Math.max(CFG.part2NMin, Math.min(100, Math.round(+e.target.value || 50)));
    e.target.value = CFG.part2NMax; $('nSlider').max = CFG.part2NMax;
    const [n, p] = getNP(); setNP(n, p);
  });
  f('t2y').addEventListener('change', e => {
    CFG.fixedYMax = Math.max(0.05, Math.min(1, +e.target.value || 0.3));
    e.target.value = CFG.fixedYMax; draw();
  });
  f('tSol').addEventListener('change', e => { CFG.showSolutions = e.target.checked; draw(); });
  f('tCopy').addEventListener('click', async () => {
    let text;
    if (state.part === 3) {
      text = PART3.map((d, i) => `${LETTERS[i]}\tn = ${d.n}\tp = ${fmtP(d.p)}`).join('\n');
    } else {
      text = 'k\tHöhe\n' + shownValues.map((x, k) => `${k}\t${fmt(x, 6)}`).join('\n');
    }
    try { await navigator.clipboard.writeText(text); f('tNote').textContent = 'Kopiert.'; }
    catch (err) { f('tNote').textContent = 'Kopieren nicht möglich.'; }
  });
}

const params = new URLSearchParams(location.search);
if (params.has('lehrer')) setupTeacher();
if (params.has('eingebettet')) document.body.classList.add('embedded');

newTarget();
showPart(partFromHash());
</script>
</body>
</html>
