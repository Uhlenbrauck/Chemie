<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aggregatzustände im Teilchenmodell</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #f7f6f2;
    --surface:   #ffffff;
    --border:    #d9d6cc;
    --text:      #1a1a18;
    --muted:     #6b6960;
    --accent:    #2d5a3d;
    --cold:      #1d8fd1;
    --hot:       #d1281d;
  }

  html, body { height: 100%; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  header {
    padding: 10px 16px 0;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  header strong { font-size: 15px; font-weight: 600; }

  /* ── Reiter ── */
  .tabs {
    display: inline-flex;
    border: 2px solid var(--border);
    border-radius: 22px;
    overflow: hidden;
    background: var(--surface);
  }

  .tabs .btn { border: none; border-radius: 0; }

  /* ── Bühne mit der Zeichenfläche ── */
  #stage {
    flex: 1;
    position: relative;
    min-height: 0;
  }

  #scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ── Bedienleiste ── */
  .controls {
    padding: 8px 16px calc(14px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 860px;
  }

  .row.buttons { justify-content: center; flex-wrap: wrap; }

  [hidden] { display: none !important; }

  .step {
    flex: none;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--surface);
    font-size: 26px;
    line-height: 1;
    color: var(--text);
    cursor: pointer;
  }

  .step:active { background: #eee; }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    min-width: 0;
    height: 48px;
    background: transparent;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-runnable-track {
    height: 10px;
    border-radius: 5px;
    background: linear-gradient(90deg, var(--cold), #6b4f8a 55%, var(--hot));
  }

  input[type=range]::-moz-range-track {
    height: 10px;
    border-radius: 5px;
    background: linear-gradient(90deg, var(--cold), #6b4f8a 55%, var(--hot));
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 34px;
    height: 34px;
    margin-top: -12px;
    border-radius: 50%;
    background: var(--surface);
    border: 3px solid var(--text);
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
  }

  input[type=range]::-moz-range-thumb {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--surface);
    border: 3px solid var(--text);
  }

  .readout {
    flex: none;
    min-width: 92px;
    text-align: right;
    font-size: 26px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .btn {
    min-height: 44px;
    padding: 0 20px;
    border-radius: 22px;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 16px;
    cursor: pointer;
  }

  .btn:disabled { cursor: default; }

  .btn[aria-pressed=true], .btn[aria-selected=true] {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .seg {
    display: inline-flex;
    border: 2px solid var(--border);
    border-radius: 22px;
    overflow: hidden;
    background: var(--surface);
  }

  .seg .btn { border: none; border-radius: 0; }

  .seg-label { color: var(--muted); font-size: 15px; }

  .readout.clock { min-width: 0; font-size: 20px; text-align: left; }

  /* ── Lehrermodus ── */
  #teacher {
    position: fixed;
    top: 8px;
    right: 8px;
    width: 290px;
    max-height: calc(100% - 16px);
    overflow: auto;
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    box-shadow: 0 4px 16px rgba(0,0,0,.15);
    z-index: 10;
  }

  #teacher summary {
    cursor: pointer;
    font-weight: 600;
    color: var(--accent);
  }

  #teacher label {
    display: grid;
    grid-template-columns: 1fr 48px;
    gap: 2px 8px;
    margin-top: 8px;
  }

  #teacher label input { grid-column: 1 / 3; width: 100%; }

  #teacher output { text-align: right; font-variant-numeric: tabular-nums; }

  #teacher .btn { margin-top: 10px; min-height: 34px; font-size: 13px; padding: 0 12px; }
</style>
</head>
<body>

<header>
  <strong>Aggregatzustände im Teilchenmodell</strong>
  <div class="tabs" role="tablist" aria-label="Teil auswählen">
    <button class="btn" role="tab" id="tab1" aria-selected="true">1 Zustände</button>
    <button class="btn" role="tab" id="tab2" aria-selected="false">2 Temperatur</button>
    <button class="btn" role="tab" id="tab3" aria-selected="false">3 Erhitzen</button>
  </div>
</header>

<div id="stage">
  <canvas id="scene" aria-label="Bechergläser mit Wasser und vergrößerte Ausschnitte mit Wasserteilchen"></canvas>
</div>

<div class="controls">
  <div class="row buttons" id="lupeSwitch" hidden>
    <span class="seg-label">Lupe:</span>
    <div class="seg" role="group" aria-label="Position der Lupe">
      <button class="btn" id="lupeIn" aria-pressed="true">Wasseroberfläche</button>
      <button class="btn" id="lupeAbove" aria-pressed="false">über dem Wasser</button>
    </div>
  </div>

  <div class="row" id="tempRow" hidden>
    <button class="step" id="minus" aria-label="Temperatur um 1 °C verringern">−</button>
    <input type="range" id="temp" min="-20" max="100" step="1" value="-10" aria-label="Temperatur">
    <button class="step" id="plus" aria-label="Temperatur um 1 °C erhöhen">+</button>
    <output class="readout" id="readout" for="temp">−10 °C</output>
  </div>

  <div class="row buttons" id="heatRow" hidden>
    <button class="btn" id="heat" aria-pressed="false">Heizplatte einschalten</button>
    <button class="btn" id="reset">Neu starten</button>
    <output class="readout clock" id="clock">0:00 min</output>
  </div>

  <div class="row buttons">
    <button class="btn" id="pause" aria-pressed="false">Pause</button>
    <button class="btn" id="slow" aria-pressed="false">Zeitlupe</button>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   Einstellungen (im Lehrermodus über ?lehrer veränderbar)
   ════════════════════════════════════════════════════════════════ */
const CFG = {
  size:        56,    // Seitenlänge eines Teilchens (Lupe hat Radius 200)
  spacing:     1.0,   // Abstand im Gitter (Vielfaches der Teilchengröße)
  ampCold:     1.0,   // Schwingungsweite bei −20 °C
  ampMelt:     2.5,   // Schwingungsweite kurz vor 0 °C
  vibFreq:     2.5,   // Schwingungen pro Sekunde
  liqSpeed0:   40,    // Geschwindigkeit flüssig bei 0 °C
  liqSpeed100: 130,   // Geschwindigkeit flüssig bei 100 °C
  gasSpeed100: 260,   // Geschwindigkeit gasförmig bei 100 °C
  gasSpeed120: 320,   // Geschwindigkeit gasförmig bei 120 °C
  gasCount:    4,     // Teilchen in der Lupe (gasförmig)
  escapeEvery: 1.2,   // Sieden: mittlerer Abstand zwischen zwei austretenden Teilchen (s)
  slowFactor:  0.25,  // Tempo in Zeitlupe
};

// Teil 1: feste Temperaturen der drei Zustände (werden nicht angezeigt)
const STATES = [
  { label: 'fest',      temp: -10 },
  { label: 'flüssig',   temp: 20 },
  { label: 'gasförmig', temp: 110 },
];

const COLORS = {
  particle:     '#5b5ef4',
  particleEdge: '#2b2d9e',
  lupeBg:       '#ffffff',   // weiß wie auf dem AB: zwischen den Teilchen ist nichts
  ink:          '#1a1a18',
  glass:        '#3a3a38',
  glassFill:    'rgba(235,245,250,0.35)',
  water:        '#cfeaf5',
  waterTop:     '#89c9e0',
  ice:          'rgba(228,246,252,0.95)',
  iceEdge:      '#7dc3dc',
  steam:        '#7dc3dc',
  thermoRed:    '#d1281d',
  label:        '#4a4a46',
};

const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = t => Math.min(1, Math.max(0, t));
const TAU = Math.PI * 2;
const SYM = TAU / 3;   // ein gleichseitiges Dreieck sieht nach 120° wieder gleich aus

function phaseOf(t, lupeAbove) {
  if (t < 0) return 'solid';
  if (t === 0) return 'melt';
  if (t < 100) return 'liquid';
  if (t === 100) return lupeAbove ? 'boilAbove' : 'boil';
  return 'gas';
}

// Ansicht = welcher Ort im Becherglas gerade vergrößert wird
function viewOf(phase) {
  if (phase === 'boil') return 'surface';
  if (phase === 'boilAbove' || phase === 'gas') return 'vapor';
  return 'bulk';
}

function fmt(t) { return (t < 0 ? '−' + (-t) : String(t)) + ' °C'; }

/* ════════════════════════════════════════════════════════════════
   Teilchensimulation für einen Lupenausschnitt
   Koordinaten: Kasten Lx × Ly, Lupenkreis (Radius 200) in der Mitte
   ════════════════════════════════════════════════════════════════ */
class Sim {
  constructor(temp) {
    this.parts = [];
    this.sites = [];
    this.time = 0;
    this.phase = null;
    this.view = null;
    this.wrapX = true;
    this.wrapY = true;
    this.surfY = 0;
    this.escapeTimer = 0;
    this.fade = 1;
    this.T = temp;
    this.lupeAbove = false;
    this.meltFrac = 0.5;      // Anteil des Ausschnitts, der beim Schmelzen noch Eis ist
    this.buildLattice();
    this.setTemp(temp);
  }

  buildLattice() {
    const s = CFG.size;
    this.dx = 1.5 * s * CFG.spacing;
    this.dy = 1.25 * s * CFG.spacing;
    const cols = Math.ceil(410 / this.dx);
    let rows = Math.ceil(410 / this.dy);
    if (rows % 2) rows++;
    this.Lx = cols * this.dx;
    this.Ly = rows * this.dy;
    this.sites = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        this.sites.push({
          x: (c + 0.5 + (r % 2 ? 0.5 : 0)) * this.dx,
          y: (r + 0.5) * this.dy,
        });
      }
    }
  }

  // nach Änderung von Größe oder Abstand im Lehrermodus
  rebuild() {
    const phase = this.phase;
    this.buildLattice();
    this.view = null;
    this.setState(this.T, phase);
  }

  setTemp(t, lupeAbove = false) {
    this.lupeAbove = lupeAbove;
    this.setState(t, phaseOf(t, lupeAbove));
  }

  setState(t, phase) {
    this.T = t;
    const view = viewOf(phase);
    if (view !== this.view) this.initView(view, phase);
    else if (phase !== this.phase) this.applyPhase(phase);
  }

  // Beim Schmelzen: Teilchen jenseits der Eisgrenze verlassen ihre Plätze
  setMeltFrac(f) {
    this.meltFrac = f;
    if (this.phase !== 'melt') return;
    const xb = this.meltBoundary();
    for (const p of this.parts) {
      if (p.mode === 'solid' && p.hx >= xb) { p.mode = 'liquid'; this.kick(p, this.liquidSpeed()); }
    }
  }

  liquidSpeed() {
    return lerp(CFG.liqSpeed0, CFG.liqSpeed100, clamp01(this.T / 100));
  }

  gasSpeed() {
    return lerp(CFG.gasSpeed100, CFG.gasSpeed120, clamp01((this.T - 100) / 20));
  }

  solidAmp() {
    return lerp(CFG.ampCold, CFG.ampMelt, clamp01((this.T + 20) / 20));
  }

  newParticle(x, y, mode) {
    return {
      x, y, vx: 0, vy: 0,
      a: 0, va: 0,
      hx: x, hy: y,
      mode,
      ph1: rand(0, TAU), ph2: rand(0, TAU), ph3: rand(0, TAU),
      f1: rand(0.8, 1.2), f2: rand(0.8, 1.2), f3: rand(0.6, 1.0),
    };
  }

  kick(p, speed) {
    const ang = rand(0, TAU);
    p.vx = Math.cos(ang) * speed;
    p.vy = Math.sin(ang) * speed;
    p.va = rand(-1, 1) * speed / 40;
  }

  // Abstand mit Berücksichtigung des periodischen Ausschnitts
  delta(ax, ay, bx, by) {
    let dx = bx - ax, dy = by - ay;
    if (this.wrapX) dx -= this.Lx * Math.round(dx / this.Lx);
    if (this.wrapY) dy -= this.Ly * Math.round(dy / this.Ly);
    return [dx, dy];
  }

  // Jedem Gitterplatz das nächstgelegene freie Teilchen zuordnen
  assignHomes(sites, parts) {
    const free = new Set(parts);
    for (const s of sites) {
      let best = null, bd = Infinity;
      for (const p of free) {
        const [dx, dy] = this.delta(p.x, p.y, s.x, s.y);
        const d = dx * dx + dy * dy;
        if (d < bd) { bd = d; best = p; }
      }
      if (!best) break;
      free.delete(best);
      best.hx = s.x; best.hy = s.y;
      best.mode = 'solid';
    }
    return free;
  }

  meltBoundary() { return this.Lx * this.meltFrac; }

  // Ansicht komplett neu aufbauen (Lupe zeigt einen anderen Ort)
  initView(view, phase) {
    this.parts = [];
    this.view = view;
    const s = CFG.size;

    if (view === 'bulk') {
      this.wrapX = true; this.wrapY = true;
      for (const st of this.sites) this.parts.push(this.newParticle(st.x, st.y, 'solid'));
    } else if (view === 'surface') {
      this.wrapX = true; this.wrapY = false;
      this.surfY = this.Ly * 0.42;
      for (const st of this.sites) {
        if (st.y > this.surfY + s * 0.3) {
          const p = this.newParticle(st.x + rand(-8, 8), st.y + rand(-8, 8), 'liquid');
          p.a = rand(0, TAU);
          this.kick(p, this.liquidSpeed());
          this.parts.push(p);
        }
      }
      this.escapeTimer = rand(0.3, CFG.escapeEvery);
    } else {
      this.wrapX = true; this.wrapY = true;
      for (let i = 0; i < CFG.gasCount; i++) {
        let p, tries = 0;
        do {
          p = this.newParticle(rand(0, this.Lx), rand(0, this.Ly), 'gas');
          tries++;
        } while (tries < 50 && this.parts.some(q => Math.hypot(...this.delta(p.x, p.y, q.x, q.y)) < s * 2));
        p.a = rand(0, TAU);
        this.kick(p, this.gasSpeed());
        this.parts.push(p);
      }
    }
    this.phase = null;
    this.applyPhase(phase);
    this.fade = 0;
  }

  // Übergang innerhalb derselben Ansicht (z. B. fest → flüssig)
  applyPhase(phase) {
    const prev = this.phase;
    this.phase = phase;
    if (this.view !== 'bulk') return;

    if (phase === 'solid') {
      this.wrapX = true;
      this.assignHomes(this.sites, this.parts);
    } else if (phase === 'liquid') {
      this.wrapX = true;
      for (const p of this.parts) {
        if (p.mode !== 'liquid') { p.mode = 'liquid'; this.kick(p, this.liquidSpeed()); }
      }
    } else if (phase === 'melt') {
      this.wrapX = false;
      const xb = this.meltBoundary();
      const iceSites = this.sites.filter(s => s.x < xb);
      for (const p of this.parts) p.mode = 'liquid';
      const rest = this.assignHomes(iceSites, this.parts);
      for (const p of rest) {
        if (prev !== 'liquid') this.kick(p, this.liquidSpeed());
        p.mode = 'liquid';
      }
    }
  }

  step(dt) {
    this.time += dt;
    const s = CFG.size;
    const D = s * 1.1;          // Mindestabstand zweier Teilchen
    const parts = this.parts;
    const vl = this.liquidSpeed();
    const vg = this.gasSpeed();

    // Bewegung
    for (const p of parts) {
      if (p.mode === 'solid') {
        const k = Math.min(1, 5 * dt);
        const [dx, dy] = this.delta(p.x, p.y, p.hx, p.hy);
        p.x += dx * k; p.y += dy * k;
        const target = Math.round(p.a / SYM) * SYM;
        p.a += (target - p.a) * k;
        continue;
      }

      if (p.mode === 'liquid') {
        // Zufällige Richtungsänderungen, Tempo wird zur Zielgeschwindigkeit geführt
        const turn = rand(-1, 1) * 2.5 * Math.sqrt(dt);
        const c = Math.cos(turn), sn = Math.sin(turn);
        const vx = p.vx * c - p.vy * sn, vy = p.vx * sn + p.vy * c;
        const sp = Math.hypot(vx, vy) || 1;
        const f = 1 + (vl / sp - 1) * Math.min(1, 3 * dt);
        p.vx = vx * f; p.vy = vy * f;
        p.va += rand(-1, 1) * 4 * dt;
        p.va = Math.max(-vl / 30, Math.min(vl / 30, p.va));

        if (this.phase === 'melt' && p.x < this.meltBoundary() + s * 0.2) p.vx += 300 * dt;
        if (this.view === 'surface' && p.y < this.surfY) p.vy += 900 * dt;
      }

      if (p.mode === 'gas') {
        const sp = Math.hypot(p.vx, p.vy) || 1;
        const f = 1 + (vg / sp - 1) * Math.min(1, 2 * dt);
        p.vx *= f; p.vy *= f;
      }

      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.a += p.va * dt;
    }

    // Zusammenstöße (Teilchen als Scheiben)
    for (let i = 0; i < parts.length; i++) {
      const a = parts[i];
      for (let j = i + 1; j < parts.length; j++) {
        const b = parts[j];
        if (a.mode === 'escape' || b.mode === 'escape') continue;
        if (a.mode === 'solid' && b.mode === 'solid') continue;
        const [dx, dy] = this.delta(a.x, a.y, b.x, b.y);
        const d2 = dx * dx + dy * dy;
        if (d2 >= D * D || d2 === 0) continue;
        const d = Math.sqrt(d2);
        const nx = dx / d, ny = dy / d;
        const overlap = D - d;
        const aFix = a.mode === 'solid', bFix = b.mode === 'solid';
        const wa = aFix ? 0 : (bFix ? 1 : 0.5);
        const wb = bFix ? 0 : (aFix ? 1 : 0.5);
        a.x -= nx * overlap * wa; a.y -= ny * overlap * wa;
        b.x += nx * overlap * wb; b.y += ny * overlap * wb;

        // Geschwindigkeiten entlang der Verbindungslinie tauschen bzw. spiegeln
        const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rv < 0) {
          if (!aFix && !bFix) {
            a.vx += rv * nx; a.vy += rv * ny;
            b.vx -= rv * nx; b.vy -= rv * ny;
          } else if (aFix) {
            const vn = b.vx * nx + b.vy * ny;
            if (vn < 0) { b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny; }
          } else {
            const vn = a.vx * nx + a.vy * ny;
            if (vn > 0) { a.vx -= 2 * vn * nx; a.vy -= 2 * vn * ny; }
          }
        }
      }
    }

    // Ränder des Ausschnitts
    for (const p of parts) {
      if (p.mode === 'solid' || p.mode === 'escape') continue;
      if (this.wrapX) p.x = ((p.x % this.Lx) + this.Lx) % this.Lx;
      else if (p.x < 0) { p.x = 0; p.vx = Math.abs(p.vx); }
      else if (p.x > this.Lx) { p.x = this.Lx; p.vx = -Math.abs(p.vx); }
      if (this.wrapY) p.y = ((p.y % this.Ly) + this.Ly) % this.Ly;
      else if (p.y > this.Ly) { p.y = this.Ly; p.vy = -Math.abs(p.vy); }
    }

    // Sieden: ab und zu verlässt ein Teilchen an der Oberfläche den Teilchenverband
    if (this.view === 'surface') {
      this.escapeTimer -= dt;
      if (this.escapeTimer <= 0) {
        this.escapeTimer = CFG.escapeEvery * rand(0.6, 1.4);
        let top = null;
        for (const p of parts) {
          if (p.mode === 'liquid' && (!top || p.y < top.y)) top = p;
        }
        if (top) {
          top.mode = 'escape';
          const ang = -Math.PI / 2 + rand(-0.5, 0.5);
          top.vx = Math.cos(ang) * vg;
          top.vy = Math.sin(ang) * vg;
          top.va = rand(-1, 1) * 4;
          // Nachschub unten am (unsichtbaren) Rand des Ausschnitts
          const q = this.newParticle(Math.random() < 0.5 ? 4 : this.Lx - 4, this.Ly - 4, 'liquid');
          q.a = rand(0, TAU);
          this.kick(q, vl);
          q.vy = -Math.abs(q.vy);
          parts.push(q);
        }
      }
      this.parts = parts.filter(p => p.mode !== 'escape' || p.y > -s * 2);
    }
  }

  // Lupeninhalt zeichnen: Mittelpunkt (cx, cy), Radius r in Bildschirmpunkten
  draw(c, cx, cy, r) {
    c.save();
    c.translate(cx, cy);
    c.beginPath();
    c.arc(0, 0, r, 0, TAU);
    c.fillStyle = COLORS.lupeBg;
    c.fill();
    c.clip();
    c.scale(r / 200, r / 200);
    c.translate(-this.Lx / 2, -this.Ly / 2);

    c.globalAlpha = this.fade;
    c.fillStyle = COLORS.particle;
    c.strokeStyle = COLORS.particleEdge;
    c.lineWidth = 2.5;
    c.lineJoin = 'round';

    const s = CFG.size;
    const amp = this.solidAmp();
    const om = TAU * CFG.vibFreq;
    const t = this.time;

    for (const p of this.parts) {
      let x = p.x, y = p.y, a = p.a;
      if (p.mode === 'solid') {
        x += amp * Math.sin(om * p.f1 * t + p.ph1);
        y += amp * Math.sin(om * p.f2 * t + p.ph2);
        a += amp * 0.012 * Math.sin(om * p.f3 * t + p.ph3);
      }
      // Teilchen am Rand des periodischen Ausschnitts doppelt zeichnen
      const xs = [x], ys = [y];
      if (this.wrapX || p.mode === 'solid') {
        if (x < s) xs.push(x + this.Lx);
        if (x > this.Lx - s) xs.push(x - this.Lx);
      }
      if (this.wrapY || p.mode === 'solid') {
        if (y < s) ys.push(y + this.Ly);
        if (y > this.Ly - s) ys.push(y - this.Ly);
      }
      for (const xx of xs) for (const yy of ys) drawTriangle(c, xx, yy, a, s);
    }
    c.restore();

    c.beginPath();
    c.arc(cx, cy, r, 0, TAU);
    c.strokeStyle = COLORS.ink;
    c.lineWidth = 3;
    c.stroke();
  }
}

/* ════════════════════════════════════════════════════════════════
   Stoffebene: Becherglas (lokale Koordinaten 200 × 280, y nach unten)
   ════════════════════════════════════════════════════════════════ */
const BEAKER = { w: 200, h: 280, water: 126 };

// Eiswürfel vom Boden aus gestapelt; f = Anteil des noch vorhandenen Eises.
// Beim Schmelzen werden die Würfel kleiner, der Stapel bleibt aufeinander liegen.
function icePile(f = 1) {
  const size = 46 * (0.4 + 0.6 * f);
  const inner = 194, bottom = 277;
  const cubes = [];
  for (let row = 0; row < 4; row++) {
    const n = row % 2 ? 3 : 4;
    const gap = (inner - n * size) / (n + 1);
    for (let i = 0; i < n; i++) {
      const j = row * 7 + i;   // feste Pseudozufallswerte, damit nichts flackert
      cubes.push({
        x: 3 + gap + size / 2 + i * (size + gap) + Math.sin(j * 12.9) * 3,
        y: bottom - size / 2 - row * size * 0.94,
        r: Math.sin(j * 7.3) * 0.12,
        s: size,
      });
    }
  }
  return cubes;
}

const ICE_PILE = icePile(1);
const ICE_FLOAT = [
  { x: 52, y: 146, r: 0.1, s: 54 }, { x: 116, y: 150, r: -0.06, s: 54 },
];

// Blasen und Dampf im Becherglas
class Macro {
  constructor() {
    this.bubbles = [];
    this.steam = [];
    this.time = 0;
    this.waterY = BEAKER.water;
  }

  step(dt, phase) {
    this.time += dt;
    const boiling = phase === 'boil' || phase === 'boilAbove';
    const gas = phase === 'gas';

    if (boiling && Math.random() < dt * 9) {
      this.bubbles.push({ x: rand(20, 175), y: rand(255, 272), r: rand(2.5, 6), v: rand(50, 90) });
    }
    for (const b of this.bubbles) { b.y -= b.v * dt; b.x += rand(-1, 1) * 20 * dt; b.r += dt * 2; }
    this.bubbles = this.bubbles.filter(b => boiling && b.y > this.waterY + b.r);

    // Wasserdampf, der aus dem Becherglas entweicht
    const rate = gas ? 30 : boiling ? 10 : 0;
    if (Math.random() < dt * rate) {
      this.steam.push({
        x: rand(15, 185),
        y: gas ? rand(150, 272) : this.waterY - 4,
        r: rand(3, 5.5),
        v: rand(30, 60),
        drift: rand(-12, 12),
      });
    }
    for (const d of this.steam) {
      d.y -= d.v * dt;
      d.x += (d.drift + rand(-1, 1) * 30) * dt;
      // Solange der Dampf im Glas ist, prallt er an der Glaswand ab
      if (d.y > 0) {
        const lo = d.r + 3, hi = BEAKER.w - d.r - 3;
        if (d.x < lo) { d.x = lo; d.drift = Math.abs(d.drift); }
        if (d.x > hi) { d.x = hi; d.drift = -Math.abs(d.drift); }
      }
    }
    this.steam = this.steam.filter(d => (gas || boiling) && d.y > -110);
  }
}

function focusPoint(phase, waterY = BEAKER.water) {
  switch (phase) {
    case 'solid':     return { x: 100, y: 236 };
    case 'melt':      return { x: 128, y: 172 };
    case 'liquid':    return { x: 95,  y: Math.max(205, waterY + 20) };
    case 'boil':      return { x: 95,  y: waterY };
    case 'boilAbove': return { x: 95,  y: Math.min(60, waterY - 50) };
    default:          return { x: 95,  y: 160 };
  }
}

/* ════════════════════════════════════════════════════════════════
   Zeichenhilfen
   ════════════════════════════════════════════════════════════════ */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawTriangle(c, x, y, a, s) {
  const r = s / Math.sqrt(3);      // Abstand Mitte → Ecke
  c.beginPath();
  for (let i = 0; i < 3; i++) {
    const ang = a - Math.PI / 2 + i * SYM;
    const px = x + r * Math.cos(ang), py = y + r * Math.sin(ang);
    i ? c.lineTo(px, py) : c.moveTo(px, py);
  }
  c.closePath();
  c.fill();
  c.stroke();
}

function beakerPath(c) {
  const { w, h } = BEAKER, r = 16;
  c.beginPath();
  c.moveTo(-9, -5);                  // Rand links leicht nach außen gewölbt
  c.quadraticCurveTo(0, -2, 0, 10);
  c.lineTo(0, h - r);
  c.quadraticCurveTo(0, h, r, h);
  c.lineTo(w - r, h);
  c.quadraticCurveTo(w, h, w, h - r);
  c.lineTo(w, 10);
  c.quadraticCurveTo(w, -2, w + 9, -5);   // Rand rechts
}

// Heizplatte unter dem Becherglas (lokale Koordinaten wie das Becherglas)
function drawHotplate(c, on) {
  roundRect(c, -24, 286, 248, 46, 8);
  c.fillStyle = '#d6d6d2';
  c.fill();
  c.strokeStyle = COLORS.glass;
  c.lineWidth = 2.5;
  c.stroke();
  roundRect(c, -14, 282, 228, 9, 3);
  c.fillStyle = on ? '#e8826f' : '#9a9a94';
  c.fill();
  c.stroke();
  for (const kx of [150, 190]) {
    c.beginPath();
    c.arc(kx, 311, 11, 0, TAU);
    c.fillStyle = '#f2f2ef';
    c.fill();
    c.stroke();
  }
  c.beginPath();
  c.arc(10, 311, 6, 0, TAU);
  c.fillStyle = on ? '#e3341f' : '#7a7a74';
  c.fill();
}

function innerClip(c) {
  const { w, h } = BEAKER, r = 16;
  c.beginPath();
  c.moveTo(1.5, -200);
  c.lineTo(1.5, h - r);
  c.quadraticCurveTo(1.5, h - 1.5, r, h - 1.5);
  c.lineTo(w - r, h - 1.5);
  c.quadraticCurveTo(w - 1.5, h - 1.5, w - 1.5, h - r);
  c.lineTo(w - 1.5, -200);
  c.closePath();
}

function drawIce(c, cube) {
  c.save();
  c.translate(cube.x, cube.y);
  c.rotate(cube.r);
  c.scale(cube.s / 54, cube.s / 54);
  roundRect(c, -27, -27, 54, 54, 7);
  c.fillStyle = COLORS.ice;
  c.fill();
  c.lineWidth = 2;
  c.strokeStyle = COLORS.iceEdge;
  c.stroke();
  c.beginPath();
  c.moveTo(-17, -12); c.lineTo(-17, -18); c.lineTo(-10, -18);
  c.strokeStyle = '#ffffff';
  c.lineWidth = 3;
  c.lineCap = 'round';
  c.stroke();
  c.restore();
}

// Becherglas an Position (x, y) mit Maßstab k; temp = null → ohne Thermometer
// opts: waterY (Wasserstand), ice (Eiswürfel), hotplate (an/aus)
function drawBeaker(c, x, y, k, phase, macro, temp, raised, opts = {}) {
  c.save();
  c.translate(x, y);
  c.scale(k, k);

  if (opts.hotplate !== undefined) drawHotplate(c, opts.hotplate);

  beakerPath(c);
  c.closePath();
  c.fillStyle = COLORS.glassFill;
  c.fill();

  c.save();
  innerClip(c);
  c.clip();

  const w = BEAKER.w, h = BEAKER.h;
  const wy = opts.waterY ?? BEAKER.water;
  const boiling = phase === 'boil' || phase === 'boilAbove';
  const hasWater = opts.waterY !== undefined ? wy < h - 2
    : phase === 'melt' || phase === 'liquid' || boiling;

  const ice = opts.ice ?? (phase === 'solid' ? ICE_PILE : phase === 'melt' ? ICE_FLOAT : []);
  ice.forEach(cube => drawIce(c, cube));

  if (hasWater) {
    c.beginPath();
    c.moveTo(0, wy);
    if (boiling) {
      for (let i = 0; i <= 20; i++) {
        c.lineTo(i * w / 20, wy + Math.sin(macro.time * 7 + i * 1.3) * 2);
      }
    } else {
      c.lineTo(w, wy);
    }
    c.lineTo(w, h); c.lineTo(0, h); c.closePath();
    c.fillStyle = COLORS.water;
    c.globalAlpha = phase === 'melt' ? 0.8 : 1;
    c.fill();
    c.globalAlpha = 1;
    c.strokeStyle = COLORS.waterTop;
    c.lineWidth = 3;
    c.beginPath();
    c.moveTo(0, wy); c.lineTo(w, wy);
    c.stroke();
  }

  c.strokeStyle = COLORS.steam;
  c.lineWidth = 1.8;
  for (const b of macro.bubbles) {
    c.beginPath(); c.arc(b.x, b.y, b.r, 0, TAU);
    c.fillStyle = 'rgba(255,255,255,0.7)';
    c.fill(); c.stroke();
  }
  c.restore();

  // Dampf (darf das Glas verlassen)
  for (const d of macro.steam) {
    c.globalAlpha = d.y < 0 ? Math.max(0, 1 + d.y / 110) : 1;
    c.beginPath(); c.arc(d.x, d.y, d.r, 0, TAU);
    c.strokeStyle = COLORS.steam;
    c.lineWidth = 1.8;
    c.stroke();
  }
  c.globalAlpha = 1;

  // Skala
  c.strokeStyle = '#9a9a94';
  c.lineWidth = 1.5;
  for (let i = 0; i < 8; i++) {
    const ty = 60 + i * 26;
    c.beginPath();
    c.moveTo(w - 14, ty); c.lineTo(w - (i % 2 ? 22 : 30), ty);
    c.stroke();
  }

  beakerPath(c);
  c.strokeStyle = COLORS.glass;
  c.lineWidth = 4;
  c.lineJoin = 'round';
  c.lineCap = 'round';
  c.stroke();

  if (temp !== null) drawThermometer(c, temp, raised);
  c.restore();
}

function drawThermometer(c, temp, raised) {
  const off = raised ? -150 : 0;
  const tx = 168, top = -40 + off, bulb = 252 + off;
  // Stab
  roundRect(c, tx - 7, top, 14, bulb - top, 7);
  c.fillStyle = 'rgba(255,255,255,0.9)';
  c.fill();
  c.strokeStyle = COLORS.glass;
  c.lineWidth = 2;
  c.stroke();
  // Flüssigkeitssäule
  const frac = (temp + 20) / 140;
  const colTop = bulb - 14 - frac * (bulb - top - 26);
  c.fillStyle = COLORS.thermoRed;
  roundRect(c, tx - 3, colTop, 6, bulb - colTop, 3);
  c.fill();
  c.beginPath(); c.arc(tx, bulb, 10, 0, TAU);
  c.fill();
  c.strokeStyle = COLORS.glass;
  c.stroke();
  // Anzeige an fester Stelle neben dem Stab
  const label = fmt(temp);
  c.font = '700 28px system-ui, -apple-system, sans-serif';
  const tw = c.measureText(label).width + 22;
  const lx = 70, ly = -70;
  roundRect(c, lx - tw / 2, ly - 20, tw, 40, 8);
  c.fillStyle = '#ffffff';
  c.fill();
  c.strokeStyle = COLORS.glass;
  c.lineWidth = 2;
  c.stroke();
  c.fillStyle = COLORS.ink;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText(label, lx, ly + 1);
}

// Verbindungslinien vom Fokuspunkt P an die Lupe (Tangenten) und kleiner Kreis
function drawConnector(c, P, lupe) {
  const dx = P.x - lupe.x, dy = P.y - lupe.y;
  const d = Math.hypot(dx, dy);
  c.strokeStyle = COLORS.ink;
  c.lineWidth = 2;
  if (d > lupe.r) {
    const base = Math.atan2(dy, dx), beta = Math.acos(lupe.r / d);
    for (const sgn of [-1, 1]) {
      c.beginPath();
      c.moveTo(P.x, P.y);
      c.lineTo(lupe.x + lupe.r * Math.cos(base + sgn * beta), lupe.y + lupe.r * Math.sin(base + sgn * beta));
      c.stroke();
    }
  }
  c.beginPath();
  c.arc(P.x, P.y, 7, 0, TAU);
  c.fillStyle = '#ffffff';
  c.fill();
  c.stroke();
}

function drawLabel(c, text, x, y, size = 17) {
  c.font = `600 ${size}px system-ui, -apple-system, sans-serif`;
  c.fillStyle = COLORS.label;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText(text, x, y);
}

/* ════════════════════════════════════════════════════════════════
   Teil 1: die drei Aggregatzustände nebeneinander
   ════════════════════════════════════════════════════════════════ */
const part1 = {
  panels: STATES.map(st => ({ ...st, sim: new Sim(st.temp), macro: new Macro() })),
  layout: null,

  computeLayout() {
    const colW = W / 3;
    const labelH = 40;
    const gap = 30;
    const R = Math.max(30, Math.min(colW * 0.44, (H - labelH) * 0.28));
    // Becherglas ohne Thermometer: lokal x −15…210, y −40…285
    const bw = 225, bh = 325;
    const k = Math.max(0.2, Math.min((H - labelH - 2 * R - gap - 8) / bh, (colW * 0.62) / bw));
    // Lupe und Becherglas zusammen senkrecht mittig anordnen
    const used = labelH + 2 * R + gap + bh * k;
    const y0 = Math.max(0, (H - 8 - used) / 2);
    return this.panels.map((p, i) => {
      const cx = colW * (i + 0.5);
      return {
        label: { x: cx, y: y0 + 20 },
        lupe: { x: cx, y: y0 + labelH + R, r: R },
        beaker: { x: cx - (-15 + bw / 2) * k, y: y0 + labelH + 2 * R + gap + 40 * k, k },
      };
    });
  },

  step(dt) {
    for (const p of this.panels) {
      p.sim.step(dt);
      p.macro.step(dt, p.sim.phase);
    }
  },

  draw(c) {
    this.panels.forEach((p, i) => {
      const L = this.layout[i];
      const phase = p.sim.phase;
      drawLabel(c, p.label, L.label.x, L.label.y, 20);
      drawBeaker(c, L.beaker.x, L.beaker.y, L.beaker.k, phase, p.macro, null, false);
      const fp = focusPoint(phase);
      drawConnector(c, { x: L.beaker.x + fp.x * L.beaker.k, y: L.beaker.y + fp.y * L.beaker.k }, L.lupe);
      p.sim.draw(c, L.lupe.x, L.lupe.y, L.lupe.r);
    });
  },

  rebuild() { this.panels.forEach(p => p.sim.rebuild()); },
};

/* ════════════════════════════════════════════════════════════════
   Teil 2: Temperatur einstellen
   ════════════════════════════════════════════════════════════════ */
const part2 = {
  T: -10,
  lupeAbove: false,
  sim: new Sim(-10),
  macro: new Macro(),
  layout: null,

  computeLayout() {
    // Becherglas mit Thermometer: lokal x −40…230, y −200…290
    const left = -40, bw = 270, top = -200, bottom = 290, bh = bottom - top;
    const labelH = 34;
    if (W >= H * 1.15) {
      // Querformat: Becherglas links, Lupe rechts
      const R = Math.min((H - labelH - 16) / 2, W * 0.25);
      const lupe = { x: W * 0.69, y: labelH + (H - labelH) / 2, r: R };
      const k = Math.min((H - labelH - 10) / bh, (W * 0.38) / bw);
      return {
        lupe,
        beaker: { x: W * 0.24 - (left + bw / 2) * k, y: H - 8 - bottom * k, k },
        labels: { bx: W * 0.24, by: 22, lx: lupe.x, ly: 22 },
      };
    }
    // Hochformat: Lupe oben rechts, Becherglas unten links
    const R = Math.min(W * 0.38, (H - labelH) * 0.27);
    const lupe = { x: W - 16 - R, y: labelH + R + 4, r: R };
    const btop = lupe.y + R + 10;
    const k = Math.min((H - btop - 8) / bh, (W * 0.55) / bw);
    return {
      lupe,
      beaker: { x: W * 0.28 - (left + bw / 2) * k, y: H - 8 - bottom * k, k },
      labels: { bx: W * 0.28, by: btop + 4, lx: lupe.x, ly: 22 },
    };
  },

  step(dt) {
    this.sim.step(dt);
    this.macro.step(dt, this.sim.phase);
  },

  draw(c) {
    const L = this.layout, phase = this.sim.phase;
    drawLabel(c, 'Teilchenebene', L.labels.lx, L.labels.ly);
    drawLabel(c, 'Stoffebene', L.labels.bx, L.labels.by);
    drawBeaker(c, L.beaker.x, L.beaker.y, L.beaker.k, phase, this.macro, this.T, phase === 'boilAbove');
    const fp = focusPoint(phase);
    drawConnector(c, { x: L.beaker.x + fp.x * L.beaker.k, y: L.beaker.y + fp.y * L.beaker.k }, L.lupe);
    this.sim.draw(c, L.lupe.x, L.lupe.y, L.lupe.r);
  },

  rebuild() { this.sim.rebuild(); },
};

/* ════════════════════════════════════════════════════════════════
   Teil 3: Erhitzen wie in V4 – Heizplatte, Stoppuhr, Diagramm
   Energie in willkürlichen Einheiten; 1 Einheit erwärmt um 1 °C.
   ════════════════════════════════════════════════════════════════ */
const HEAT = {
  start:      -10,   // Anfangstemperatur des Eises
  power:      2,     // zugeführte Energie pro Sekunde
  melt:       60,    // Schmelzen (didaktisch verkürzt, real etwa 80)
  vaporize:   540,   // Verdampfen des ganzen Wassers (Verhältnis wie in echt)
  minPerSec:  0.1,   // angezeigte Minuten pro Sekunde Ablauf
  fastLiquid: 4,     // Zeitraffer beim Erwärmen des Wassers (0 bis 100 °C)
  sampleMin:  0.5,   // Messpunkt alle 30 s wie in V4
};

const part3 = {
  E: 0,
  time: 0,
  heating: false,
  finished: false,
  lupeAbove: false,
  points: [],
  sim: new Sim(HEAT.start),
  macro: new Macro(),
  layout: null,
  state: null,

  reset() {
    this.E = 0;
    this.time = 0;
    this.points = [{ t: 0, T: HEAT.start }];
    this.finished = false;
    this.setHeating(false);
    this.state = this.compute();
    this.sim.setState(this.state.T, this.state.phase);
  },

  // Temperatur und Zustand aus der zugeführten Energie
  compute() {
    const e1 = -HEAT.start, e2 = e1 + HEAT.melt, e3 = e2 + 100, e4 = e3 + HEAT.vaporize;
    const E = this.E;
    const boil = this.lupeAbove ? 'boilAbove' : 'boil';
    if (E < e1) return { T: HEAT.start + E, phase: 'solid', ice: 1, water: 0 };
    if (E < e2) { const f = 1 - (E - e1) / HEAT.melt; return { T: 0, phase: 'melt', ice: f, water: 1 - f }; }
    if (E < e3) return { T: E - e2, phase: 'liquid', ice: 0, water: 1 };
    const water = Math.max(0, 1 - (E - e3) / HEAT.vaporize);
    return { T: 100, phase: boil, ice: 0, water, done: water <= 0.02 };
  },

  // Die Heizplatte wird nur eingeschaltet; ein Abkühlen ist nicht vorgesehen
  setHeating(on) {
    this.heating = on;
    ui.heat.setAttribute('aria-pressed', on);
    ui.heat.disabled = on || this.finished;
    ui.heat.textContent = this.finished ? 'Versuch beendet'
      : on ? 'Heizplatte ist an' : 'Heizplatte einschalten';
  },

  fast() { return this.heating && this.state && this.state.phase === 'liquid'; },

  step(dt) {
    if (this.heating) {
      const f = this.fast() ? HEAT.fastLiquid : 1;
      this.E += HEAT.power * dt * f;
      this.time += dt * f;
      const tMin = this.time * HEAT.minPerSec;
      const last = this.points[this.points.length - 1];
      if (tMin - last.t >= HEAT.sampleMin - 1e-9) {
        this.points.push({ t: last.t + HEAT.sampleMin, T: this.compute().T });
      }
    }
    const st = this.state = this.compute();
    if (st.done && this.heating) { this.finished = true; this.setHeating(false); }   // fast alles verdampft
    if (st.phase === 'melt' && this.sim.phase !== 'melt') this.sim.meltFrac = st.ice;
    this.sim.setState(st.T, st.phase);
    this.sim.setMeltFrac(st.ice);
    this.sim.step(dt);
    this.macro.waterY = this.waterY(st);
    this.macro.step(dt, st.phase);
  },

  // Wasserstand im Becherglas (lokale Koordinaten)
  waterY(st) {
    const h = BEAKER.h, full = BEAKER.water;
    return h - (h - full) * st.water;
  },

  computeLayout() {
    // Becherglas mit Thermometer und Heizplatte: lokal x −40…230, y −200…335
    const left = -40, bw = 270, top = -200, bottom = 335, bh = bottom - top;
    const chartH = Math.max(150, H * 0.36);
    const th = H - chartH;
    const R = Math.max(40, Math.min(th / 2 - 22, W * 0.26));
    const lupe = { x: W * 0.68, y: 30 + (th - 30) / 2, r: R };
    const k = Math.min((th - 30) / bh, (W * 0.4) / bw);
    return {
      lupe,
      beaker: { x: W * 0.22 - (left + bw / 2) * k, y: th - 4 - bottom * k, k },
      labels: { bx: W * 0.22, lx: lupe.x, y: 16 },
      chart: { x: 64, y: th + 14, w: W - 64 - 20, h: chartH - 14 - 44 },
    };
  },

  draw(c) {
    const L = this.layout, st = this.state, phase = st.phase;
    const wy = this.waterY(st);
    drawLabel(c, 'Stoffebene', L.labels.bx, L.labels.y);
    drawLabel(c, 'Teilchenebene', L.labels.lx, L.labels.y);
    drawBeaker(c, L.beaker.x, L.beaker.y, L.beaker.k, phase, this.macro, Math.round(st.T),
      phase === 'boilAbove', {
        waterY: wy,
        ice: st.ice > 0 ? icePile(st.ice) : [],
        hotplate: this.heating,
      });
    const fp = focusPoint(phase, wy);
    drawConnector(c, { x: L.beaker.x + fp.x * L.beaker.k, y: L.beaker.y + fp.y * L.beaker.k }, L.lupe);
    this.sim.draw(c, L.lupe.x, L.lupe.y, L.lupe.r);
    drawChart(c, L.chart, this.points, { t: this.time * HEAT.minPerSec, T: st.T });
    if (this.fast()) {
      c.font = '600 15px system-ui, -apple-system, sans-serif';
      c.fillStyle = COLORS.thermoRed;
      c.textAlign = 'right';
      c.textBaseline = 'top';
      c.fillText(`Zeitraffer ×${HEAT.fastLiquid}`, L.chart.x + L.chart.w - 8, L.chart.y + 6);
    }
  },

  rebuild() { this.sim.rebuild(); },
};

// Temperatur-Zeit-Diagramm im Stil eines Punkt-(XY)-Diagramms
function drawChart(c, box, points, now) {
  const tMax = Math.max(12, Math.ceil(now.t + 1));
  const yMin = -20, yMax = 120;
  const X = t => box.x + (t / tMax) * box.w;
  const Y = T => box.y + (1 - (T - yMin) / (yMax - yMin)) * box.h;

  c.save();
  c.fillStyle = '#ffffff';
  c.fillRect(box.x, box.y, box.w, box.h);

  c.font = '13px system-ui, -apple-system, sans-serif';
  c.fillStyle = COLORS.label;
  c.lineWidth = 1;

  // Gitter und Beschriftung
  c.textAlign = 'right';
  c.textBaseline = 'middle';
  for (let T = yMin; T <= yMax; T += 20) {
    c.strokeStyle = T === 0 ? '#9a9a94' : '#e6e4dc';
    c.beginPath(); c.moveTo(box.x, Y(T)); c.lineTo(box.x + box.w, Y(T)); c.stroke();
    c.fillText(String(T).replace('-', '−'), box.x - 6, Y(T));
  }
  const step = box.w / tMax < 28 ? 2 : 1;
  c.textAlign = 'center';
  c.textBaseline = 'top';
  for (let t = 0; t <= tMax; t += step) {
    c.strokeStyle = '#e6e4dc';
    c.beginPath(); c.moveTo(X(t), box.y); c.lineTo(X(t), box.y + box.h); c.stroke();
    c.fillText(String(t), X(t), box.y + box.h + 4);
  }
  c.strokeStyle = COLORS.glass;
  c.lineWidth = 1.5;
  c.strokeRect(box.x, box.y, box.w, box.h);

  c.font = '600 14px system-ui, -apple-system, sans-serif';
  c.fillText('Zeit (min)', box.x + box.w / 2, box.y + box.h + 22);
  c.save();
  c.translate(box.x - 44, box.y + box.h / 2);
  c.rotate(-Math.PI / 2);
  c.textBaseline = 'middle';
  c.fillText('Temperatur (°C)', 0, 0);
  c.restore();

  // Messkurve
  c.beginPath();
  c.rect(box.x, box.y, box.w, box.h);
  c.clip();
  const all = [...points, now];
  c.strokeStyle = '#4472c4';
  c.lineWidth = 2;
  c.beginPath();
  all.forEach((p, i) => (i ? c.lineTo(X(p.t), Y(p.T)) : c.moveTo(X(p.t), Y(p.T))));
  c.stroke();
  c.fillStyle = '#4472c4';
  for (const p of points) {
    c.beginPath(); c.arc(X(p.t), Y(p.T), 3.5, 0, TAU); c.fill();
  }
  c.beginPath();
  c.arc(X(now.t), Y(now.T), 5, 0, TAU);
  c.fillStyle = COLORS.thermoRed;
  c.fill();
  c.restore();
}

/* ════════════════════════════════════════════════════════════════
   Bedienung
   ════════════════════════════════════════════════════════════════ */
const ui = {
  tab1:   document.getElementById('tab1'),
  tab2:   document.getElementById('tab2'),
  tab3:   document.getElementById('tab3'),
  heatRow: document.getElementById('heatRow'),
  heat:   document.getElementById('heat'),
  reset:  document.getElementById('reset'),
  clock:  document.getElementById('clock'),
  temp:   document.getElementById('temp'),
  tempRow: document.getElementById('tempRow'),
  out:    document.getElementById('readout'),
  minus:  document.getElementById('minus'),
  plus:   document.getElementById('plus'),
  pause:  document.getElementById('pause'),
  slow:   document.getElementById('slow'),
  lupeSwitch: document.getElementById('lupeSwitch'),
  lupeIn:     document.getElementById('lupeIn'),
  lupeAbove:  document.getElementById('lupeAbove'),
};

let paused = false;
let slow = false;
let current = part1;

const HASHES = { 1: '#zustaende', 2: '#temperatur', 3: '#erhitzen' };

function partFromHash() {
  return Number(Object.keys(HASHES).find(n => HASHES[n] === location.hash)) || 1;
}

function showPart(n) {
  current = [part1, part2, part3][n - 1];
  ui.tab1.setAttribute('aria-selected', n === 1);
  ui.tab2.setAttribute('aria-selected', n === 2);
  ui.tab3.setAttribute('aria-selected', n === 3);
  ui.tempRow.hidden = n !== 2;
  ui.heatRow.hidden = n !== 3;
  syncLupeButtons();
  if (location.hash !== HASHES[n]) history.replaceState(null, '', HASHES[n]);
  resize();
}

// Schalter für die Lupe nur beim Sieden zeigen
function syncLupeButtons() {
  let show = false;
  if (current === part2) show = part2.T === 100;
  if (current === part3) show = part3.state.phase === 'boil' || part3.state.phase === 'boilAbove';
  if (ui.lupeSwitch.hidden === show) ui.lupeSwitch.hidden = !show;
  const above = current === part3 ? part3.lupeAbove : part2.lupeAbove;
  ui.lupeIn.setAttribute('aria-pressed', !above);
  ui.lupeAbove.setAttribute('aria-pressed', above);
}

function setTemp(t) {
  part2.T = Math.max(-20, Math.min(100, t));
  ui.temp.value = part2.T;
  ui.out.textContent = fmt(part2.T);
  part2.sim.setTemp(part2.T, part2.lupeAbove);
  syncLupeButtons();
}

function setLupe(above) {
  if (current === part3) {
    part3.lupeAbove = above;
  } else {
    part2.lupeAbove = above;
    part2.sim.setTemp(part2.T, above);
  }
  syncLupeButtons();
}

function fmtClock(min) {
  const total = Math.floor(min * 60 + 1e-6);
  return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')} min`;
}

ui.tab1.addEventListener('click', () => showPart(1));
ui.tab2.addEventListener('click', () => showPart(2));
ui.tab3.addEventListener('click', () => showPart(3));
ui.heat.addEventListener('click', () => part3.setHeating(true));
ui.reset.addEventListener('click', () => { part3.lupeAbove = false; part3.reset(); syncLupeButtons(); });
ui.temp.addEventListener('input', () => setTemp(Number(ui.temp.value)));
ui.minus.addEventListener('click', () => setTemp(part2.T - 1));
ui.plus.addEventListener('click', () => setTemp(part2.T + 1));
ui.lupeIn.addEventListener('click', () => setLupe(false));
ui.lupeAbove.addEventListener('click', () => setLupe(true));

ui.pause.addEventListener('click', () => {
  paused = !paused;
  ui.pause.setAttribute('aria-pressed', paused);
  ui.pause.textContent = paused ? 'Weiter' : 'Pause';
});

ui.slow.addEventListener('click', () => {
  slow = !slow;
  ui.slow.setAttribute('aria-pressed', slow);
});

window.addEventListener('hashchange', () => showPart(partFromHash()));
window.addEventListener('resize', resize);

/* ════════════════════════════════════════════════════════════════
   Ablauf
   ════════════════════════════════════════════════════════════════ */
function resize() {
  const r = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  part1.layout = part1.computeLayout();
  part2.layout = part2.computeLayout();
  part3.layout = part3.computeLayout();
}

let last = performance.now();
function frame(now) {
  // Der erste Zeitstempel kann vor dem Start liegen: Zeitspanne nie negativ
  const real = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  if (!paused) {
    const dt = real * (slow ? CFG.slowFactor : 1);
    const sub = 3;
    for (let i = 0; i < sub; i++) current.step(dt / sub);
  }
  for (const s of [...part1.panels.map(p => p.sim), part2.sim, part3.sim]) s.fade = Math.min(1, s.fade + real / 0.3);
  if (current === part3) {
    ui.clock.textContent = fmtClock(part3.time * HEAT.minPerSec);
    syncLupeButtons();
  }
  ctx.clearRect(0, 0, W, H);
  current.draw(ctx);
  requestAnimationFrame(frame);
}

/* ════════════════════════════════════════════════════════════════
   Lehrermodus: Feineinstellung der Teilchenbewegung
   ════════════════════════════════════════════════════════════════ */
const TEACHER_FIELDS = [
  ['size',        'Teilchengröße',                    30, 90, 1],
  ['spacing',     'Abstand im Gitter',                0.85, 1.6, 0.05],
  ['ampCold',     'Schwingung bei −20 °C',            0, 10, 0.5],
  ['ampMelt',     'Schwingung kurz vor 0 °C',         0, 15, 0.5],
  ['vibFreq',     'Schwingungen pro Sekunde',         1, 10, 0.5],
  ['liqSpeed0',   'Tempo flüssig bei 0 °C',           5, 200, 5],
  ['liqSpeed100', 'Tempo flüssig bei 100 °C',         10, 400, 5],
  ['gasSpeed100', 'Tempo gasförmig bei 100 °C',       50, 600, 10],
  ['gasSpeed120', 'Tempo gasförmig bei 120 °C',       50, 700, 10],
  ['gasCount',    'Teilchen in der Lupe (gasförmig)', 1, 12, 1],
  ['escapeEvery', 'Sieden: Sekunden pro Teilchen',    0.2, 5, 0.1],
  ['slowFactor',  'Tempo in Zeitlupe',                0.05, 0.75, 0.05],
];

function setupTeacher() {
  const box = document.createElement('details');
  box.id = 'teacher';
  box.open = true;
  box.innerHTML = '<summary>Lehrermodus – Feineinstellung</summary>';
  const rebuild = new Set(['size', 'spacing', 'gasCount']);
  for (const [key, label, min, max, st] of TEACHER_FIELDS) {
    const l = document.createElement('label');
    l.innerHTML = `<span>${label}</span><output>${CFG[key]}</output>` +
      `<input type="range" min="${min}" max="${max}" step="${st}" value="${CFG[key]}">`;
    const input = l.querySelector('input'), out = l.querySelector('output');
    input.addEventListener('input', () => {
      CFG[key] = Number(input.value);
      out.textContent = input.value;
      if (rebuild.has(key)) { part1.rebuild(); part2.rebuild(); part3.rebuild(); }
    });
    box.appendChild(l);
  }
  const copy = document.createElement('button');
  copy.className = 'btn';
  copy.textContent = 'Werte kopieren';
  copy.addEventListener('click', async () => {
    const text = JSON.stringify(CFG, null, 2);
    try { await navigator.clipboard.writeText(text); copy.textContent = 'Kopiert ✓'; }
    catch { prompt('Werte zum Kopieren:', text); }
    setTimeout(() => (copy.textContent = 'Werte kopieren'), 1500);
  });
  box.appendChild(copy);
  document.body.appendChild(box);
}

if (new URLSearchParams(location.search).has('lehrer')) setupTeacher();

part3.reset();
setTemp(part2.T);
showPart(partFromHash());
requestAnimationFrame(frame);
</script>
