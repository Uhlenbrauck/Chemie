<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aggregatzustände im Teilchenmodell</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #f7f6f2;
    --surface:   #ffffff;
    --border:    #d9d6cc;
    --text:      #1a1a18;
    --muted:     #6b6960;
    --accent:    #2d5a3d;
    --cold:      #1d8fd1;
    --hot:       #d1281d;
  }

  html, body { height: 100%; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  header {
    padding: 10px 16px 0;
    font-size: 15px;
    color: var(--muted);
  }

  header strong { color: var(--text); font-weight: 600; }

  /* ── Bühne mit der Zeichenfläche ── */
  #stage {
    flex: 1;
    position: relative;
    min-height: 0;
  }

  #scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ── Bedienleiste ── */
  .controls {
    padding: 8px 16px calc(14px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 860px;
  }

  .row.buttons { justify-content: center; flex-wrap: wrap; }

  .step {
    flex: none;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--surface);
    font-size: 26px;
    line-height: 1;
    color: var(--text);
    cursor: pointer;
  }

  .step:active { background: #eee; }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    min-width: 0;
    height: 48px;
    background: transparent;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-runnable-track {
    height: 10px;
    border-radius: 5px;
    background: linear-gradient(90deg, var(--cold), #6b4f8a 55%, var(--hot));
  }

  input[type=range]::-moz-range-track {
    height: 10px;
    border-radius: 5px;
    background: linear-gradient(90deg, var(--cold), #6b4f8a 55%, var(--hot));
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 34px;
    height: 34px;
    margin-top: -12px;
    border-radius: 50%;
    background: var(--surface);
    border: 3px solid var(--text);
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
  }

  input[type=range]::-moz-range-thumb {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--surface);
    border: 3px solid var(--text);
  }

  .readout {
    flex: none;
    min-width: 92px;
    text-align: right;
    font-size: 26px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .btn {
    min-height: 44px;
    padding: 0 20px;
    border-radius: 22px;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 16px;
    cursor: pointer;
  }

  .btn[aria-pressed=true] {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .seg {
    display: inline-flex;
    border: 2px solid var(--border);
    border-radius: 22px;
    overflow: hidden;
    background: var(--surface);
  }

  .seg .btn { border: none; border-radius: 0; }

  .seg-label { color: var(--muted); font-size: 15px; }

  #lupeSwitch[hidden] { display: none; }

  /* ── Lehrermodus ── */
  #teacher {
    position: fixed;
    top: 8px;
    right: 8px;
    width: 290px;
    max-height: calc(100% - 16px);
    overflow: auto;
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    box-shadow: 0 4px 16px rgba(0,0,0,.15);
    z-index: 10;
  }

  #teacher summary {
    cursor: pointer;
    font-weight: 600;
    color: var(--accent);
  }

  #teacher label {
    display: grid;
    grid-template-columns: 1fr 48px;
    gap: 2px 8px;
    margin-top: 8px;
  }

  #teacher label input { grid-column: 1 / 3; width: 100%; }

  #teacher output { text-align: right; font-variant-numeric: tabular-nums; }

  #teacher .btn { margin-top: 10px; min-height: 34px; font-size: 13px; padding: 0 12px; }
</style>
</head>
<body>

<header><strong>Aggregatzustände im Teilchenmodell</strong></header>

<div id="stage">
  <canvas id="scene" aria-label="Becherglas mit Wasser und vergrößerter Ausschnitt mit Wasserteilchen"></canvas>
</div>

<div class="controls">
  <div class="row buttons" id="lupeSwitch" hidden>
    <span class="seg-label">Lupe:</span>
    <div class="seg" role="group" aria-label="Position der Lupe">
      <button class="btn" id="lupeIn" aria-pressed="true">im Wasser</button>
      <button class="btn" id="lupeAbove" aria-pressed="false">über dem Wasser</button>
    </div>
  </div>

  <div class="row">
    <button class="step" id="minus" aria-label="Temperatur um 1 °C verringern">−</button>
    <input type="range" id="temp" min="-20" max="120" step="1" value="-10" aria-label="Temperatur">
    <button class="step" id="plus" aria-label="Temperatur um 1 °C erhöhen">+</button>
    <output class="readout" id="readout" for="temp">−10 °C</output>
  </div>

  <div class="row buttons">
    <button class="btn" id="pause" aria-pressed="false">Pause</button>
    <button class="btn" id="slow" aria-pressed="false">Zeitlupe</button>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   Einstellungen (im Lehrermodus über ?lehrer veränderbar)
   ════════════════════════════════════════════════════════════════ */
const CFG = {
  size:        56,    // Seitenlänge eines Teilchens (Lupe hat Radius 200)
  spacing:     1.0,   // Abstand im Gitter (Vielfaches der Teilchengröße)
  ampCold:     1.0,   // Schwingungsweite bei −20 °C
  ampMelt:     2.5,   // Schwingungsweite kurz vor 0 °C
  vibFreq:     2.5,   // Schwingungen pro Sekunde
  liqSpeed0:   40,    // Geschwindigkeit flüssig bei 0 °C
  liqSpeed100: 130,   // Geschwindigkeit flüssig bei 100 °C
  gasSpeed100: 260,   // Geschwindigkeit gasförmig bei 100 °C
  gasSpeed120: 320,   // Geschwindigkeit gasförmig bei 120 °C
  gasCount:    4,     // Teilchen in der Lupe (gasförmig)
  escapeEvery: 1.2,   // Sieden: mittlerer Abstand zwischen zwei austretenden Teilchen (s)
  slowFactor:  0.25,  // Tempo in Zeitlupe
};

const COLORS = {
  particle:     '#5b5ef4',
  particleEdge: '#2b2d9e',
  lupeBg:       '#f3f5fa',
  ink:          '#1a1a18',
  glass:        '#3a3a38',
  glassFill:    'rgba(235,245,250,0.35)',
  water:        '#cfeaf5',
  waterTop:     '#89c9e0',
  ice:          'rgba(228,246,252,0.95)',
  iceEdge:      '#7dc3dc',
  steam:        '#7dc3dc',
  thermoRed:    '#d1281d',
  label:        '#4a4a46',
};

/* ════════════════════════════════════════════════════════════════
   Zustand der Bedienung
   ════════════════════════════════════════════════════════════════ */
const ui = {
  temp:   document.getElementById('temp'),
  out:    document.getElementById('readout'),
  minus:  document.getElementById('minus'),
  plus:   document.getElementById('plus'),
  pause:  document.getElementById('pause'),
  slow:   document.getElementById('slow'),
  lupeSwitch: document.getElementById('lupeSwitch'),
  lupeIn:     document.getElementById('lupeIn'),
  lupeAbove:  document.getElementById('lupeAbove'),
};

let T = Number(ui.temp.value);
let paused = false;
let slow = false;
let lupeAbove = false;

function phaseOf(t) {
  if (t < 0) return 'solid';
  if (t === 0) return 'melt';
  if (t < 100) return 'liquid';
  if (t === 100) return lupeAbove ? 'boilAbove' : 'boil';
  return 'gas';
}

// Ansicht = welcher Ort im Becherglas gerade vergrößert wird
function viewOf(phase) {
  if (phase === 'boil') return 'surface';
  if (phase === 'boilAbove' || phase === 'gas') return 'vapor';
  return 'bulk';
}

function fmt(t) { return (t < 0 ? '−' + (-t) : String(t)) + ' °C'; }

/* ════════════════════════════════════════════════════════════════
   Teilchensimulation im Lupenausschnitt
   Koordinaten: Kasten Lx × Ly, Lupenkreis (Radius 200) in der Mitte
   ════════════════════════════════════════════════════════════════ */
const sim = {
  parts: [],
  sites: [],
  Lx: 420, Ly: 420,
  dx: 84, dy: 70,
  time: 0,
  phase: null,
  view: null,
  wrapX: true, wrapY: true,
  surfY: 0,
  escapeTimer: 0,
  fade: 1,
};

const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
const SYM = TAU / 3;   // ein gleichseitiges Dreieck sieht nach 120° wieder gleich aus

function buildLattice() {
  const s = CFG.size;
  sim.dx = 1.5 * s * CFG.spacing;
  sim.dy = 1.25 * s * CFG.spacing;
  const cols = Math.ceil(410 / sim.dx);
  let rows = Math.ceil(410 / sim.dy);
  if (rows % 2) rows++;
  sim.Lx = cols * sim.dx;
  sim.Ly = rows * sim.dy;
  sim.sites = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      sim.sites.push({
        x: (c + 0.5 + (r % 2 ? 0.5 : 0)) * sim.dx,
        y: (r + 0.5) * sim.dy,
      });
    }
  }
}

function newParticle(x, y, mode) {
  return {
    x, y, vx: 0, vy: 0,
    a: 0, va: 0,
    hx: x, hy: y,
    mode,
    ph1: rand(0, TAU), ph2: rand(0, TAU), ph3: rand(0, TAU),
    f1: rand(0.8, 1.2), f2: rand(0.8, 1.2), f3: rand(0.6, 1.0),
  };
}

function lerp(a, b, t) { return a + (b - a) * t; }

function liquidSpeed() {
  return lerp(CFG.liqSpeed0, CFG.liqSpeed100, Math.min(Math.max(T, 0), 100) / 100);
}

function gasSpeed() {
  return lerp(CFG.gasSpeed100, CFG.gasSpeed120, Math.min(Math.max(T - 100, 0), 20) / 20);
}

function solidAmp() {
  return lerp(CFG.ampCold, CFG.ampMelt, Math.min(Math.max(T + 20, 0), 20) / 20);
}

function kick(p, speed) {
  const ang = rand(0, TAU);
  p.vx = Math.cos(ang) * speed;
  p.vy = Math.sin(ang) * speed;
  p.va = rand(-1, 1) * speed / 40;
}

// Abstand mit Berücksichtigung des periodischen Ausschnitts
function delta(ax, ay, bx, by) {
  let dx = bx - ax, dy = by - ay;
  if (sim.wrapX) dx -= sim.Lx * Math.round(dx / sim.Lx);
  if (sim.wrapY) dy -= sim.Ly * Math.round(dy / sim.Ly);
  return [dx, dy];
}

// Jedem Gitterplatz das nächstgelegene freie Teilchen zuordnen
function assignHomes(sites, parts) {
  const free = new Set(parts);
  for (const s of sites) {
    let best = null, bd = Infinity;
    for (const p of free) {
      const [dx, dy] = delta(p.x, p.y, s.x, s.y);
      const d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = p; }
    }
    if (!best) break;
    free.delete(best);
    best.hx = s.x; best.hy = s.y;
    best.mode = 'solid';
  }
  return free;
}

function meltBoundary() { return sim.Lx * 0.5; }

// Ansicht komplett neu aufbauen (Lupe zeigt einen anderen Ort)
function initView(view, phase) {
  sim.parts = [];
  sim.view = view;
  const s = CFG.size;

  if (view === 'bulk') {
    sim.wrapX = true; sim.wrapY = true;
    for (const st of sim.sites) sim.parts.push(newParticle(st.x, st.y, 'solid'));
  } else if (view === 'surface') {
    sim.wrapX = true; sim.wrapY = false;
    sim.surfY = sim.Ly * 0.42;
    for (const st of sim.sites) {
      if (st.y > sim.surfY + s * 0.3) {
        const p = newParticle(st.x + rand(-8, 8), st.y + rand(-8, 8), 'liquid');
        p.a = rand(0, TAU);
        kick(p, liquidSpeed());
        sim.parts.push(p);
      }
    }
    sim.escapeTimer = rand(0.3, CFG.escapeEvery);
  } else {
    sim.wrapX = true; sim.wrapY = true;
    for (let i = 0; i < CFG.gasCount; i++) {
      let p, tries = 0;
      do {
        p = newParticle(rand(0, sim.Lx), rand(0, sim.Ly), 'gas');
        tries++;
      } while (tries < 50 && sim.parts.some(q => Math.hypot(...delta(p.x, p.y, q.x, q.y)) < s * 2));
      p.a = rand(0, TAU);
      kick(p, gasSpeed());
      sim.parts.push(p);
    }
  }
  sim.phase = null;
  applyPhase(phase);
  sim.fade = 0;
}

// Übergang innerhalb derselben Ansicht (z. B. fest → flüssig)
function applyPhase(phase) {
  const prev = sim.phase;
  sim.phase = phase;
  if (sim.view !== 'bulk') return;

  if (phase === 'solid') {
    sim.wrapX = true;
    assignHomes(sim.sites, sim.parts);
  } else if (phase === 'liquid') {
    sim.wrapX = true;
    for (const p of sim.parts) {
      if (p.mode !== 'liquid') { p.mode = 'liquid'; kick(p, liquidSpeed()); }
    }
  } else if (phase === 'melt') {
    sim.wrapX = false;
    const xb = meltBoundary();
    const iceSites = sim.sites.filter(s => s.x < xb);
    for (const p of sim.parts) p.mode = 'liquid';
    const rest = assignHomes(iceSites, sim.parts);
    for (const p of rest) {
      if (prev !== 'liquid') kick(p, liquidSpeed());
      p.mode = 'liquid';
    }
  }
}

function setTemp(t) {
  T = Math.max(-20, Math.min(120, t));
  ui.temp.value = T;
  ui.out.textContent = fmt(T);
  ui.lupeSwitch.hidden = T !== 100;
  syncPhase();
}

function syncPhase() {
  const phase = phaseOf(T);
  const view = viewOf(phase);
  if (view !== sim.view) initView(view, phase);
  else if (phase !== sim.phase) applyPhase(phase);
}

/* ── Physik ── */
function step(dt) {
  sim.time += dt;
  const s = CFG.size;
  const D = s * 1.1;          // Mindestabstand zweier Teilchen
  const parts = sim.parts;
  const vl = liquidSpeed();
  const vg = gasSpeed();

  // Bewegung
  for (const p of parts) {
    if (p.mode === 'solid') {
      const k = Math.min(1, 5 * dt);
      const [dx, dy] = delta(p.x, p.y, p.hx, p.hy);
      p.x += dx * k; p.y += dy * k;
      const target = Math.round(p.a / SYM) * SYM;
      p.a += (target - p.a) * k;
      continue;
    }

    if (p.mode === 'liquid') {
      // Zufällige Richtungsänderungen, Tempo wird zur Zielgeschwindigkeit geführt
      const turn = rand(-1, 1) * 2.5 * Math.sqrt(dt);
      const c = Math.cos(turn), sn = Math.sin(turn);
      const vx = p.vx * c - p.vy * sn, vy = p.vx * sn + p.vy * c;
      const sp = Math.hypot(vx, vy) || 1;
      const f = 1 + (vl / sp - 1) * Math.min(1, 3 * dt);
      p.vx = vx * f; p.vy = vy * f;
      p.va += rand(-1, 1) * 4 * dt;
      p.va = Math.max(-vl / 30, Math.min(vl / 30, p.va));

      if (sim.phase === 'melt' && p.x < meltBoundary() + s * 0.2) p.vx += 300 * dt;
      if (sim.view === 'surface' && p.y < sim.surfY) p.vy += 900 * dt;
    }

    if (p.mode === 'gas') {
      const sp = Math.hypot(p.vx, p.vy) || 1;
      const f = 1 + (vg / sp - 1) * Math.min(1, 2 * dt);
      p.vx *= f; p.vy *= f;
    }

    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.a += p.va * dt;
  }

  // Zusammenstöße (Teilchen als Scheiben)
  for (let i = 0; i < parts.length; i++) {
    const a = parts[i];
    for (let j = i + 1; j < parts.length; j++) {
      const b = parts[j];
      if (a.mode === 'escape' || b.mode === 'escape') continue;
      if (a.mode === 'solid' && b.mode === 'solid') continue;
      const [dx, dy] = delta(a.x, a.y, b.x, b.y);
      const d2 = dx * dx + dy * dy;
      if (d2 >= D * D || d2 === 0) continue;
      const d = Math.sqrt(d2);
      const nx = dx / d, ny = dy / d;
      const overlap = D - d;
      const aFix = a.mode === 'solid', bFix = b.mode === 'solid';
      const wa = aFix ? 0 : (bFix ? 1 : 0.5);
      const wb = bFix ? 0 : (aFix ? 1 : 0.5);
      a.x -= nx * overlap * wa; a.y -= ny * overlap * wa;
      b.x += nx * overlap * wb; b.y += ny * overlap * wb;

      // Geschwindigkeiten entlang der Verbindungslinie tauschen bzw. spiegeln
      const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (rv < 0) {
        if (!aFix && !bFix) {
          a.vx += rv * nx; a.vy += rv * ny;
          b.vx -= rv * nx; b.vy -= rv * ny;
        } else if (aFix) {
          const vn = b.vx * nx + b.vy * ny;
          if (vn < 0) { b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny; }
        } else {
          const vn = a.vx * nx + a.vy * ny;
          if (vn > 0) { a.vx -= 2 * vn * nx; a.vy -= 2 * vn * ny; }
        }
      }
    }
  }

  // Ränder des Ausschnitts
  for (const p of parts) {
    if (p.mode === 'solid') continue;
    if (p.mode === 'escape') continue;
    if (sim.wrapX) p.x = ((p.x % sim.Lx) + sim.Lx) % sim.Lx;
    else if (p.x < 0) { p.x = 0; p.vx = Math.abs(p.vx); }
    else if (p.x > sim.Lx) { p.x = sim.Lx; p.vx = -Math.abs(p.vx); }
    if (sim.wrapY) p.y = ((p.y % sim.Ly) + sim.Ly) % sim.Ly;
    else if (p.y > sim.Ly) { p.y = sim.Ly; p.vy = -Math.abs(p.vy); }
  }

  // Sieden: ab und zu verlässt ein Teilchen an der Oberfläche den Teilchenverband
  if (sim.view === 'surface') {
    sim.escapeTimer -= dt;
    if (sim.escapeTimer <= 0) {
      sim.escapeTimer = CFG.escapeEvery * rand(0.6, 1.4);
      let top = null;
      for (const p of parts) {
        if (p.mode === 'liquid' && (!top || p.y < top.y)) top = p;
      }
      if (top) {
        top.mode = 'escape';
        const ang = -Math.PI / 2 + rand(-0.5, 0.5);
        top.vx = Math.cos(ang) * vg;
        top.vy = Math.sin(ang) * vg;
        top.va = rand(-1, 1) * 4;
        // Nachschub unten am (unsichtbaren) Rand des Ausschnitts
        const q = newParticle(Math.random() < 0.5 ? 4 : sim.Lx - 4, sim.Ly - 4, 'liquid');
        q.a = rand(0, TAU);
        kick(q, vl);
        q.vy = -Math.abs(q.vy);
        parts.push(q);
      }
    }
    sim.parts = parts.filter(p => p.mode !== 'escape' || p.y > -s * 2);
  }
}

/* ════════════════════════════════════════════════════════════════
   Stoffebene: Becherglas (lokale Koordinaten 200 × 280, y nach unten)
   ════════════════════════════════════════════════════════════════ */
const BEAKER = { w: 200, h: 280, water: 126, left: -40, right: 230, top: -200, bottom: 290 };

const ICE_PILE = [
  { x: 42,  y: 244, r: -0.08 }, { x: 102, y: 246, r: 0.05 }, { x: 160, y: 243, r: -0.04 },
  { x: 70,  y: 186, r: 0.12 },  { x: 132, y: 184, r: -0.1 },
  { x: 100, y: 128, r: 0.06 },
];
const ICE_FLOAT = [
  { x: 52, y: 146, r: 0.1 }, { x: 116, y: 150, r: -0.06 },
];

const macro = { bubbles: [], steam: [] };

function focusPoint(phase) {
  switch (phase) {
    case 'solid':     return { x: 100, y: 236 };
    case 'melt':      return { x: 128, y: 172 };
    case 'liquid':    return { x: 95,  y: 205 };
    case 'boil':      return { x: 95,  y: BEAKER.water };
    case 'boilAbove': return { x: 95,  y: 60 };
    default:          return { x: 95,  y: 160 };
  }
}

function thermoRaised(phase) { return phase === 'boilAbove'; }

function stepMacro(dt, phase) {
  const boiling = phase === 'boil' || phase === 'boilAbove';
  const gas = phase === 'gas';

  // Blasen im siedenden Wasser
  if (boiling && Math.random() < dt * 9) {
    macro.bubbles.push({ x: rand(20, 175), y: rand(255, 272), r: rand(2.5, 6), v: rand(50, 90) });
  }
  for (const b of macro.bubbles) { b.y -= b.v * dt; b.x += rand(-1, 1) * 20 * dt; b.r += dt * 2; }
  macro.bubbles = macro.bubbles.filter(b => boiling && b.y > BEAKER.water + b.r);

  // Wasserdampf, der aus dem Becherglas entweicht
  const rate = gas ? 30 : boiling ? 10 : 0;
  if (Math.random() < dt * rate) {
    macro.steam.push({
      x: rand(15, 185),
      y: gas ? rand(150, 272) : BEAKER.water - 4,
      r: rand(3, 5.5),
      v: rand(30, 60),
      drift: rand(-12, 12),
    });
  }
  for (const d of macro.steam) {
    d.y -= d.v * dt;
    d.x += (d.drift + rand(-1, 1) * 30) * dt;
  }
  macro.steam = macro.steam.filter(d => (gas || boiling) && d.y > -110);
}

/* ════════════════════════════════════════════════════════════════
   Zeichnen
   ════════════════════════════════════════════════════════════════ */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, layout = null;

function resize() {
  const r = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  layout = computeLayout();
}

function computeLayout() {
  const bw = BEAKER.right - BEAKER.left, bh = BEAKER.bottom - BEAKER.top;
  const labelH = 34;
  if (W >= H * 1.15) {
    // Querformat: Becherglas links, Lupe rechts
    const R = Math.min((H - labelH - 16) / 2, W * 0.25);
    const lupe = { x: W * 0.69, y: labelH + (H - labelH) / 2, r: R };
    const k = Math.min((H - labelH - 10) / bh, (W * 0.38) / bw);
    const bx = W * 0.24 - (BEAKER.left + bw / 2) * k;
    const by = H - 8 - BEAKER.bottom * k;
    return { lupe, beaker: { x: bx, y: by, k }, labels: { bx: W * 0.24, lx: lupe.x, y: 22 } };
  }
  // Hochformat: Lupe oben rechts, Becherglas unten links
  const R = Math.min(W * 0.38, (H - labelH) * 0.27);
  const lupe = { x: W - 16 - R, y: labelH + R + 4, r: R };
  const top = lupe.y + R + 10;
  const k = Math.min((H - top - 8) / bh, (W * 0.55) / bw);
  const bx = W * 0.28 - (BEAKER.left + bw / 2) * k;
  const by = H - 8 - BEAKER.bottom * k;
  return { lupe, beaker: { x: bx, y: by, k }, labels: { bx: W * 0.28, lx: lupe.x, y: 22, by: top + 4 } };
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function beakerPath(c) {
  const { w, h } = BEAKER, r = 16;
  c.beginPath();
  c.moveTo(-12, -6);                 // Ausguss
  c.quadraticCurveTo(0, -2, 0, 12);
  c.lineTo(0, h - r);
  c.quadraticCurveTo(0, h, r, h);
  c.lineTo(w - r, h);
  c.quadraticCurveTo(w, h, w, h - r);
  c.lineTo(w, 0);
}

function innerClip(c) {
  const { w, h } = BEAKER, r = 16;
  c.beginPath();
  c.moveTo(1.5, -200);
  c.lineTo(1.5, h - r);
  c.quadraticCurveTo(1.5, h - 1.5, r, h - 1.5);
  c.lineTo(w - r, h - 1.5);
  c.quadraticCurveTo(w - 1.5, h - 1.5, w - 1.5, h - r);
  c.lineTo(w - 1.5, -200);
  c.closePath();
}

function drawIce(c, cube) {
  c.save();
  c.translate(cube.x, cube.y);
  c.rotate(cube.r);
  roundRect(c, -27, -27, 54, 54, 7);
  c.fillStyle = COLORS.ice;
  c.fill();
  c.lineWidth = 2;
  c.strokeStyle = COLORS.iceEdge;
  c.stroke();
  c.beginPath();
  c.moveTo(-17, -12); c.lineTo(-17, -18); c.lineTo(-10, -18);
  c.strokeStyle = '#ffffff';
  c.lineWidth = 3;
  c.lineCap = 'round';
  c.stroke();
  c.restore();
}

function drawBeaker(phase) {
  const { x, y, k } = layout.beaker;
  const c = ctx;
  c.save();
  c.translate(x, y);
  c.scale(k, k);

  // Glas (Füllung)
  beakerPath(c);
  c.lineTo(0, 0);
  c.fillStyle = COLORS.glassFill;
  c.fill();

  c.save();
  innerClip(c);
  c.clip();

  const w = BEAKER.w, h = BEAKER.h, wy = BEAKER.water;
  const hasWater = phase === 'melt' || phase === 'liquid' || phase === 'boil' || phase === 'boilAbove';

  if (phase === 'solid') ICE_PILE.forEach(cube => drawIce(c, cube));
  if (phase === 'melt') ICE_FLOAT.forEach(cube => drawIce(c, cube));

  if (hasWater) {
    c.beginPath();
    if (phase === 'boil' || phase === 'boilAbove') {
      c.moveTo(0, wy);
      for (let i = 0; i <= 20; i++) {
        c.lineTo(i * w / 20, wy + Math.sin(sim.time * 7 + i * 1.3) * 2);
      }
    } else {
      c.moveTo(0, wy); c.lineTo(w, wy);
    }
    c.lineTo(w, h); c.lineTo(0, h); c.closePath();
    c.fillStyle = COLORS.water;
    c.globalAlpha = phase === 'melt' ? 0.8 : 1;
    c.fill();
    c.globalAlpha = 1;
    c.strokeStyle = COLORS.waterTop;
    c.lineWidth = 3;
    c.beginPath();
    c.moveTo(0, wy); c.lineTo(w, wy);
    c.stroke();
  }

  c.strokeStyle = COLORS.steam;
  c.lineWidth = 1.8;
  for (const b of macro.bubbles) {
    c.beginPath(); c.arc(b.x, b.y, b.r, 0, TAU);
    c.fillStyle = 'rgba(255,255,255,0.7)';
    c.fill(); c.stroke();
  }
  c.restore();

  // Dampf (darf das Glas verlassen)
  for (const d of macro.steam) {
    const alpha = d.y < 0 ? Math.max(0, 1 + d.y / 110) : 1;
    c.globalAlpha = alpha;
    c.beginPath(); c.arc(d.x, d.y, d.r, 0, TAU);
    c.strokeStyle = COLORS.steam;
    c.lineWidth = 1.8;
    c.stroke();
  }
  c.globalAlpha = 1;

  // Skala
  c.strokeStyle = '#9a9a94';
  c.lineWidth = 1.5;
  for (let i = 0; i < 8; i++) {
    const ty = 60 + i * 26;
    c.beginPath();
    c.moveTo(w - 14, ty); c.lineTo(w - (i % 2 ? 22 : 30), ty);
    c.stroke();
  }

  // Glas (Umriss)
  beakerPath(c);
  c.strokeStyle = COLORS.glass;
  c.lineWidth = 4;
  c.lineJoin = 'round';
  c.lineCap = 'round';
  c.stroke();

  drawThermometer(c, phase);
  c.restore();
}

function drawThermometer(c, phase) {
  const off = thermoRaised(phase) ? -150 : 0;
  const tx = 168, top = -40 + off, bulb = 252 + off;
  // Stab
  roundRect(c, tx - 7, top, 14, bulb - top, 7);
  c.fillStyle = 'rgba(255,255,255,0.9)';
  c.fill();
  c.strokeStyle = COLORS.glass;
  c.lineWidth = 2;
  c.stroke();
  // Flüssigkeitssäule
  const frac = (T + 20) / 140;
  const colTop = bulb - 14 - frac * (bulb - top - 26);
  c.fillStyle = COLORS.thermoRed;
  roundRect(c, tx - 3, colTop, 6, bulb - colTop, 3);
  c.fill();
  c.beginPath(); c.arc(tx, bulb, 10, 0, TAU);
  c.fill();
  c.strokeStyle = COLORS.glass;
  c.stroke();
  // Anzeige
  const label = fmt(T);
  c.font = '700 28px system-ui, -apple-system, sans-serif';
  const tw = c.measureText(label).width + 22;
  const lx = 70, ly = -70;           // Anzeige bleibt an fester Stelle neben dem Stab
  roundRect(c, lx - tw / 2, ly - 20, tw, 40, 8);
  c.fillStyle = '#ffffff';
  c.fill();
  c.strokeStyle = COLORS.glass;
  c.lineWidth = 2;
  c.stroke();
  c.fillStyle = COLORS.ink;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText(label, lx, ly + 1);
}

function drawTriangle(c, x, y, a, s) {
  const r = s / Math.sqrt(3);      // Abstand Mitte → Ecke
  c.beginPath();
  for (let i = 0; i < 3; i++) {
    const ang = a - Math.PI / 2 + i * SYM;
    const px = x + r * Math.cos(ang), py = y + r * Math.sin(ang);
    i ? c.lineTo(px, py) : c.moveTo(px, py);
  }
  c.closePath();
  c.fill();
  c.stroke();
}

function drawLupe(phase) {
  const { lupe } = layout;
  const bk = layout.beaker;
  const fp = focusPoint(phase);
  const P = { x: bk.x + fp.x * bk.k, y: bk.y + fp.y * bk.k };
  const c = ctx;

  // Verbindungslinien (Tangenten vom Fokuspunkt an die Lupe)
  const dx = P.x - lupe.x, dy = P.y - lupe.y;
  const d = Math.hypot(dx, dy);
  c.strokeStyle = COLORS.ink;
  c.lineWidth = 2;
  if (d > lupe.r) {
    const base = Math.atan2(dy, dx), beta = Math.acos(lupe.r / d);
    for (const sgn of [-1, 1]) {
      c.beginPath();
      c.moveTo(P.x, P.y);
      c.lineTo(lupe.x + lupe.r * Math.cos(base + sgn * beta), lupe.y + lupe.r * Math.sin(base + sgn * beta));
      c.stroke();
    }
  }
  c.beginPath();
  c.arc(P.x, P.y, 7, 0, TAU);
  c.fillStyle = '#ffffff';
  c.fill();
  c.stroke();

  // Inhalt der Lupe
  const k = lupe.r / 200;
  c.save();
  c.translate(lupe.x, lupe.y);
  c.beginPath();
  c.arc(0, 0, lupe.r, 0, TAU);
  c.fillStyle = COLORS.lupeBg;
  c.fill();
  c.clip();
  c.scale(k, k);
  c.translate(-sim.Lx / 2, -sim.Ly / 2);

  c.globalAlpha = sim.fade;
  c.fillStyle = COLORS.particle;
  c.strokeStyle = COLORS.particleEdge;
  c.lineWidth = 2.5;
  c.lineJoin = 'round';

  const s = CFG.size;
  const amp = solidAmp();
  const om = TAU * CFG.vibFreq;
  const t = sim.time;
  const margin = s;

  for (const p of sim.parts) {
    let x = p.x, y = p.y, a = p.a;
    if (p.mode === 'solid') {
      x += amp * Math.sin(om * p.f1 * t + p.ph1);
      y += amp * Math.sin(om * p.f2 * t + p.ph2);
      a += amp * 0.012 * Math.sin(om * p.f3 * t + p.ph3);
    }
    // Teilchen am Rand des periodischen Ausschnitts doppelt zeichnen
    const xs = [x], ys = [y];
    if (sim.wrapX || p.mode === 'solid') {
      if (x < margin) xs.push(x + sim.Lx);
      if (x > sim.Lx - margin) xs.push(x - sim.Lx);
    }
    if (sim.wrapY || p.mode === 'solid') {
      if (y < margin) ys.push(y + sim.Ly);
      if (y > sim.Ly - margin) ys.push(y - sim.Ly);
    }
    for (const xx of xs) for (const yy of ys) drawTriangle(c, xx, yy, a, s);
  }
  c.restore();

  c.beginPath();
  c.arc(lupe.x, lupe.y, lupe.r, 0, TAU);
  c.strokeStyle = COLORS.ink;
  c.lineWidth = 3;
  c.stroke();
}

function drawLabels() {
  const c = ctx, L = layout.labels;
  c.font = '600 17px system-ui, -apple-system, sans-serif';
  c.fillStyle = COLORS.label;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText('Teilchenebene', L.lx, L.y);
  c.fillText('Stoffebene', L.bx, L.by || L.y);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const phase = sim.phase;
  drawLabels();
  drawBeaker(phase);
  drawLupe(phase);
}

/* ════════════════════════════════════════════════════════════════
   Ablauf
   ════════════════════════════════════════════════════════════════ */
let last = performance.now();
function frame(now) {
  const real = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!paused) {
    const dt = real * (slow ? CFG.slowFactor : 1);
    const sub = 3;
    for (let i = 0; i < sub; i++) step(dt / sub);
    stepMacro(dt, sim.phase);
  }
  sim.fade = Math.min(1, sim.fade + real / 0.3);
  draw();
  requestAnimationFrame(frame);
}

ui.temp.addEventListener('input', () => setTemp(Number(ui.temp.value)));
ui.minus.addEventListener('click', () => setTemp(T - 1));
ui.plus.addEventListener('click', () => setTemp(T + 1));

ui.pause.addEventListener('click', () => {
  paused = !paused;
  ui.pause.setAttribute('aria-pressed', paused);
  ui.pause.textContent = paused ? 'Weiter' : 'Pause';
});

ui.slow.addEventListener('click', () => {
  slow = !slow;
  ui.slow.setAttribute('aria-pressed', slow);
});

function setLupe(above) {
  lupeAbove = above;
  ui.lupeIn.setAttribute('aria-pressed', !above);
  ui.lupeAbove.setAttribute('aria-pressed', above);
  syncPhase();
}
ui.lupeIn.addEventListener('click', () => setLupe(false));
ui.lupeAbove.addEventListener('click', () => setLupe(true));

window.addEventListener('resize', resize);

/* ════════════════════════════════════════════════════════════════
   Lehrermodus: Feineinstellung der Teilchenbewegung
   ════════════════════════════════════════════════════════════════ */
const TEACHER_FIELDS = [
  ['size',        'Teilchengröße',                   30, 90, 1],
  ['spacing',     'Abstand im Gitter',               0.85, 1.6, 0.05],
  ['ampCold',     'Schwingung bei −20 °C',           0, 10, 0.5],
  ['ampMelt',     'Schwingung kurz vor 0 °C',        0, 15, 0.5],
  ['vibFreq',     'Schwingungen pro Sekunde',        1, 10, 0.5],
  ['liqSpeed0',   'Tempo flüssig bei 0 °C',          5, 200, 5],
  ['liqSpeed100', 'Tempo flüssig bei 100 °C',        10, 400, 5],
  ['gasSpeed100', 'Tempo gasförmig bei 100 °C',      50, 600, 10],
  ['gasSpeed120', 'Tempo gasförmig bei 120 °C',      50, 700, 10],
  ['gasCount',    'Teilchen in der Lupe (gasförmig)', 1, 12, 1],
  ['escapeEvery', 'Sieden: Sekunden pro Teilchen',   0.2, 5, 0.1],
  ['slowFactor',  'Tempo in Zeitlupe',               0.05, 0.75, 0.05],
];

function setupTeacher() {
  const box = document.createElement('details');
  box.id = 'teacher';
  box.open = true;
  box.innerHTML = '<summary>Lehrermodus – Feineinstellung</summary>';
  const rebuild = new Set(['size', 'spacing', 'gasCount']);
  for (const [key, label, min, max, st] of TEACHER_FIELDS) {
    const l = document.createElement('label');
    l.innerHTML = `<span>${label}</span><output>${CFG[key]}</output>` +
      `<input type="range" min="${min}" max="${max}" step="${st}" value="${CFG[key]}">`;
    const input = l.querySelector('input'), out = l.querySelector('output');
    input.addEventListener('input', () => {
      CFG[key] = Number(input.value);
      out.textContent = input.value;
      if (rebuild.has(key)) { buildLattice(); initView(sim.view, phaseOf(T)); }
    });
    box.appendChild(l);
  }
  const copy = document.createElement('button');
  copy.className = 'btn';
  copy.textContent = 'Werte kopieren';
  copy.addEventListener('click', async () => {
    const text = JSON.stringify(CFG, null, 2);
    try { await navigator.clipboard.writeText(text); copy.textContent = 'Kopiert ✓'; }
    catch { prompt('Werte zum Kopieren:', text); }
    setTimeout(() => (copy.textContent = 'Werte kopieren'), 1500);
  });
  box.appendChild(copy);
  document.body.appendChild(box);
}

if (new URLSearchParams(location.search).has('lehrer')) setupTeacher();

buildLattice();
resize();
setTemp(T);
requestAnimationFrame(frame);
</script>
